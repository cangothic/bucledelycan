function pintarVentana(forzar){
  const raiz = $('#ventana');
  let html = '';
  let clave = '', familia = '';
  if (G && G.fase === 'carta' && G.carta && UI.vista === 'juego'){
    familia = `carta${G.carta.mazo}${G.carta.k}`;
    clave = `${familia}${G.carta.elegida ?? ''}${ocupado}`;
    html = ocupado ? '' : htmlCarta();
  }
  else if (G && G.fase === 'reto' && G.reto && UI.vista === 'juego' && esMio(G.turno)){
    if (!UI.reto || UI.reto.n !== G.reto.n) UI.reto = {...nuevoReto(G.reto.ep), n:G.reto.n};
    familia = `reto${G.reto.ep}${G.reto.motivo}`;
    clave = `${familia}${UI.reto.fin ? 'fin' : ''}`;
    if (raiz.dataset.clave === clave && !forzar) return;
    html = htmlReto();
  }
  else if (G && G.tratoPendiente && UI.vista === 'juego' && esMio(G.tratoPendiente.para)){
    clave = familia = 'pregunta';
    if (raiz.dataset.clave === clave && !forzar) return;
    html = htmlPregunta();
  }
  else if (UI.ventana){
    const v = UI.ventana;
    clave = familia = v.t + (v.i ?? '') + (v.para ?? '');
    if (v.t === 'trato' && raiz.dataset.clave === clave && !forzar) return;
    html = v.t === 'titulo' ? htmlTitulo(v.i) : v.t === 'reglas' ? htmlReglas() : v.t === 'trato' ? htmlTrato()
         : v.t === 'final' && G && G.ranking ? htmlFinal() : v.t === 'terminarYa' ? htmlTerminarYa() : '';
  }
  // La misma ventana con contenido nuevo (una jugada del reto, una respuesta): se cambia por dentro,
  // sin volver a animarla ni perder el desplazamiento en el celular.
  const vieja = raiz.querySelector('.ventana');
  if (html && vieja && raiz.dataset.familia === familia){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    vieja.className = t.content.firstElementChild.className;
    vieja.innerHTML = t.content.firstElementChild.innerHTML;
  } else raiz.innerHTML = html ? `<div class="velo" data-velo="1">${html}</div>` : '';
  raiz.dataset.clave = clave;
  raiz.dataset.familia = html ? familia : '';
  const enReto = G && G.fase === 'reto' && UI.reto && !UI.reto.fin;
  const primero = raiz.querySelector('#r-num') || (enReto ? null : raiz.querySelector('[data-a="usarCarta"],[data-a="aceptar"],[data-a="retoSeguir"],.ventana .btn.go,.ventana button'));
  if (primero && html) primero.focus({preventScroll:true});
}

// En la preparación el tablero muestra el tema elegido; en la partida, el de la partida.
const temaVisible = () => UI.vista === 'setup' || !G ? UI.setup.tema : (G.tema || 'algoritmos');

function render(sinAnim){
  if (temaVisible() !== TEMA){
    aplicarTema(temaVisible());
    armarTablero();
    sinAnim = true;
  }
  pintarCasillas();
  pintarFichas(sinAnim);
  pintarMesa();
  pintarPanel();
  pintarVentana();
  programarBot();
  emitir();
}

// ---------- eventos ----------
const ACCIONES = {
  tirar:() => accion(tirar),
  comprar:() => accion(comprar),
  noComprar:() => accion(noComprar),
  terminarTurno:() => accion(terminarTurno),
  pagarBucle:() => accion(pagarBucle),
  cartaBreak:() => accion(cartaBreak),
  usarCarta:() => accion(usarCarta),
  responder:(i, k, v) => G.carta && G.carta.elegida === undefined && esMio(G.turno) && accion(() => { G.carta.elegida = +v; }),
  pagarDeuda:() => accion(pagarDeuda),
  quiebra:() => accion(quiebra),
  ejercicio:i => puedeGestionar() && accion(() => hacerEjercicio(i)),
  quitarEjercicio:i => puedeGestionar() && accion(() => quitarEjercicio(i)),
  hipoteca:i => puedeGestionar() && accion(() => hipotecar(i)),
  recuperar:i => puedeGestionar() && accion(() => recuperar(i)),
  verJugador:(i, k) => { UI.ver = k === G.turno ? null : k; pintarPanel(); },
  negociar:() => { UI.ventana = {t:'trato', para:G.jugadores.findIndex((p, k) => k !== G.turno && !p.fuera), doy:[], recibo:[], dineroDoy:0, dineroRecibo:0, cartasDoy:0, cartasRecibo:0}; pintarVentana(true); },
  tratoCon:(i, k) => { Object.assign(UI.ventana, {para:k, recibo:[], dineroRecibo:0, cartasRecibo:0, aviso:''}); pintarVentana(true); },
  proponer:() => proponer(),
  aceptar:() => G.tratoPendiente && esMio(G.tratoPendiente.para) && accion(() => responderTrato(true)),
  rechazar:() => G.tratoPendiente && esMio(G.tratoPendiente.para) && accion(() => responderTrato(false)),
  reglas:() => { UI.ventana = {t:'reglas'}; pintarVentana(); },
  cerrar:() => { UI.ventana = null; pintarVentana(); },
  verFinal:() => { UI.ventana = {t:'final'}; pintarVentana(); },
  jugarReto:() => accion(empezarReto),
  r:(i, k, v, el) => jugarReto(el.dataset.r, v),
  retoSeguir:() => {
    if (!UI.reto || !UI.reto.fin) return;
    if (soyInvitado()) return enviar({t:'jugada', a:'retoSeguir', gano:UI.reto.fin.gano});
    accion(() => terminarReto(UI.reto.fin.gano));
  },
  pagarRenta:() => accion(() => { const {monto, a} = G.pend; G.pend = null; anotar(`${cur().nombre} paga la renta completa: ${money(monto)}.`); return cobrar(cur(), monto, a, 'despues'); }),
  seguirRecreo:() => accion(despues),
  terminarYa:() => { UI.ventana = {t:'terminarYa'}; pintarVentana(); },
  confirmarFin:() => { UI.ventana = null; accion(terminar); },
  nueva:() => { sentarConectados(); UI.vista = 'setup'; UI.ventana = null; guardar(); render(); },
  volver:() => { UI.vista = 'juego'; guardar(); render(); },
  empezar:() => {
    // Si un bot está a media jugada, la partida nueva espera a que termine.
    if (ocupado) return setTimeout(ACCIONES.empezar, 150);
    const s = UI.setup;
    clearTimeout(botTimer);
    nuevaPartida({jugadores:s.jugadores.map(j => ({...j})), tema:s.tema, retos:s.retos !== false, modo:s.modo, bote:s.bote});
  },
  tema:(i, k, v) => { if (TEMAS_ABIERTOS.includes(v)){ UI.setup.tema = v; render(); } },
  ficha:(i, k) => {
    const usadas = UI.setup.jugadores.filter((j, x) => x !== k).map(j => j.ficha);
    const j = UI.setup.jugadores[k];
    let x = FICHAS.findIndex(f => f.id === j.ficha);
    do { x = (x + 1) % FICHAS.length; } while (usadas.includes(FICHAS[x].id));
    j.ficha = FICHAS[x].id;
    pintarPanel();
  },
  tipo:(i, k, v) => {
    const j = UI.setup.jugadores[k], bot = v === '1';
    if (j.bot === bot) return;
    const usados = UI.setup.jugadores.map(x => x.nombre);
    if (bot && !NOMBRES_BOT.includes(j.nombre)) j.nombre = NOMBRES_BOT.find(n => !usados.includes(n)) || `Bot ${k + 1}`;
    else if (!bot && NOMBRES_BOT.includes(j.nombre)) j.nombre = `Jugador ${k + 1}`;
    j.bot = bot;
    pintarPanel();
  },
  agregar:() => {
    const s = UI.setup, usadas = s.jugadores.map(j => j.ficha), usados = s.jugadores.map(j => j.nombre);
    s.jugadores.push({nombre:NOMBRES_BOT.find(n => !usados.includes(n)) || `Bot ${s.jugadores.length + 1}`, ficha:FICHAS.find(f => !usadas.includes(f.id)).id, bot:true});
    pintarPanel();
  },
  quitar:(i, k) => {
    const j = UI.setup.jugadores[k], c = j.disp && RED.conexiones.get(j.disp);
    if (c){ c.send({t:'fuera', texto:'El anfitrión te sacó de la sala.'}); RED.conexiones.delete(j.disp); setTimeout(() => c.close(), 500); }
    UI.setup.jugadores.splice(k, 1);
    pintarPanel();
  },
  crearSala:() => !enLinea() && crearSala(),
  unirse:() => !enLinea() && unirse(),
  salirSala:() => { UI.invitacion = null; salirDeSala(); },
  sinSala:() => {
    UI.invitacion = null;
    RED.msg = '';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    const s = cargar();
    if (s){ G = s.G; UI.vista = s.vista || 'juego'; }
    render(true);
  },
  reentrar:() => {
    if (!soyInvitado() || RED.estado !== 'perdida') return;
    Object.assign(RED, {intentos:0, estado:'reconectando'});
    avisoRed('Volviendo a entrar…');
    conectarConAnfitrion();
  },
  copiarEnlace:() => {
    const listo = () => avisoRed('Enlace copiado.');
    try { navigator.clipboard.writeText(enlaceSala()).then(listo, () => avisoRed('Copia el enlace a mano.')); }
    catch (e){ avisoRed('Copia el enlace a mano.'); }
  },
  modo:(i, k, v) => { UI.setup.modo = v; pintarPanel(); },
};

function proponer(){
  const t = UI.ventana, A = G.jugadores[G.turno], B = G.jugadores[t.para];
  const trato = {de:G.turno, para:t.para, doy:[...t.doy], recibo:[...t.recibo],
    dineroDoy:Math.max(0, Math.floor(+t.dineroDoy || 0)), dineroRecibo:Math.max(0, Math.floor(+t.dineroRecibo || 0)),
    cartasDoy:Math.max(0, Math.floor(+t.cartasDoy || 0)), cartasRecibo:Math.max(0, Math.floor(+t.cartasRecibo || 0))};
  const aviso = msg => { t.aviso = msg; const el = $('#aviso'); if (el) el.textContent = msg; };
  if (!trato.doy.length && !trato.recibo.length && !trato.dineroDoy && !trato.dineroRecibo && !trato.cartasDoy && !trato.cartasRecibo) return aviso('Elige algo para cambiar.');
  if (trato.dineroDoy > A.dinero) return aviso(`${A.nombre} solo tiene ${money(A.dinero)}.`);
  if (trato.dineroRecibo > B.dinero) return aviso(`${B.nombre} solo tiene ${money(B.dinero)}.`);
  if (trato.cartasDoy > A.cartas.length || trato.cartasRecibo > B.cartas.length) return aviso('No hay tantas cartas break.');
  if (soyInvitado()) return enviar({t:'jugada', a:'proponer', trato});
  const respuesta = ofrecerTrato(trato);
  if (respuesta) return aviso(respuesta);
  UI.ventana = null;
  pintarVentana();
}

// Devuelve por qué no se cerró el trato (un bot que no acepta), o nada si se cerró o quedó esperando respuesta.
function ofrecerTrato(trato){
  const B = G.jugadores[trato.para];
  if (B.bot){
    if (!botAcepta(trato)) return `${B.nombre} no acepta: el trato no le conviene. Ofrece más o pide menos.`;
    accion(() => { anotar(`${B.nombre} acepta el trato.`); cerrarTrato(trato); });
    return '';
  }
  anotar(`${G.jugadores[trato.de].nombre} le propone un trato a ${B.nombre}.`);
  G.tratoPendiente = trato;
  guardar();
  render();
  return '';
}

document.addEventListener('click', e => {
  const velo = e.target.closest('[data-velo]');
  if (velo && e.target === velo){
    const t = UI.ventana && UI.ventana.t;
    if (t){ UI.ventana = null; pintarVentana(); }
    return;
  }
  const el = e.target.closest('[data-a],[data-i]');
  if (!el || el.tagName === 'INPUT') return;
  const a = el.dataset.a, i = el.dataset.i !== undefined ? +el.dataset.i : undefined;
  if (!a){
    if (i !== undefined){ UI.ventana = {t:'titulo', i}; pintarVentana(); }
    return;
  }
  const fn = ACCIONES[a], k = el.dataset.k !== undefined ? +el.dataset.k : undefined;
  if (!fn) return;
  if (soyInvitado()){
    if (SOLO_ANFITRION.has(a)) return;
    if (JUGADAS.has(a)) return enviar({t:'jugada', a, i, k, v:el.dataset.v});
  }
  fn(i, k, el.dataset.v, el);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('nombre')){ UI.setup.jugadores[+el.dataset.k].nombre = el.value; emitir(); }
  if (el.id === 'sala-codigo') UI.unirse.codigo = el.value;
  if (el.id === 'sala-nombre') UI.unirse.nombre = el.value;
  if (el.dataset.campo && UI.ventana && UI.ventana.t === 'trato') UI.ventana[el.dataset.campo] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'bote'){ UI.setup.bote = el.checked; emitir(); }
  if (el.id === 'retos'){ UI.setup.retos = el.checked; emitir(); }
  if (el.dataset.lado && UI.ventana && UI.ventana.t === 'trato'){
    const lista = UI.ventana[el.dataset.lado], i = +el.dataset.i;
    if (el.checked && !lista.includes(i)) lista.push(i);
    if (!el.checked) lista.splice(lista.indexOf(i), 1);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.ventana){ UI.ventana = null; pintarVentana(); }
  if (e.key === 'Enter' && (e.target.id === 'sala-codigo' || e.target.id === 'sala-nombre') && !enLinea()){ e.preventDefault(); unirse(); }
  if (G && G.fase === 'reto' && UI.reto && !UI.reto.fin){
    const dir = {ArrowUp:'N', ArrowRight:'E', ArrowDown:'S', ArrowLeft:'O'}[e.key];
    if (dir && UI.reto.def.tipo === 'laberinto'){ e.preventDefault(); jugarReto('mueve', dir); }
    if (e.key === 'Enter' && e.target.id === 'r-num'){ e.preventDefault(); jugarReto('prueba'); }
  }
});

// ---------- arranque ----------
function arrancar(data){
  const s = data && data.G ? data : cargar();
  UI.setup = (data && data.setup) || (s && s.setup) || setupInicial();
  if (!TEMAS_ABIERTOS.includes(UI.setup.tema)) UI.setup.tema = TEMAS_ABIERTOS[0];
  UI.unirse = {codigo:'', nombre:''};
  try { UI.unirse.nombre = localStorage.getItem('lycanopolis.nombre') || ''; } catch (e) {}
  const salaDelEnlace = new URLSearchParams(location.search).get('sala');
  if (salaDelEnlace) UI.unirse.codigo = UI.invitacion = salaDelEnlace.toUpperCase().replace(/[^A-Z0-9]/g, '');
  // quien llega con una invitación ve el tablero limpio; su partida guardada sigue ahí si juega sin sala
  if (s && s.G && !salaDelEnlace){
    G = s.G;
    UI.vista = s.vista || 'juego';
    if (G.fase === 'final') UI.ventana = null;
  }
  // un anfitrión que recarga: vuelve a abrir su sala y espera a que los invitados entren de nuevo
  const remoto = j => j.disp && j.disp !== 'anfitrion';
  const reabrir = G && G.sala && !salaDelEnlace && (G.jugadores.some(j => remoto(j) && !j.fuera) || UI.setup.jugadores.some(remoto));
  if (reabrir){
    if (G.fase !== 'final') G.jugadores.forEach((j, k) => { if (remoto(j) && !j.fuera && !j.desconectado){ j.desconectado = true; esperarA(k); } });
    UI.setup.jugadores.forEach(j => { if (remoto(j)) j.desconectado = true; });
  } else if (UI.setup.jugadores.some(remoto)){
    // sin sala, los asientos de invitados no tienen quién los ocupe
    UI.setup.jugadores = UI.setup.jugadores.filter(j => !remoto(j));
    if (UI.setup.jugadores.length < 2) UI.setup = setupInicial();
  }
  render(true);
  if (reabrir) crearSala(G.sala);
  new ResizeObserver(() => pintarFichas(true)).observe($('#tablero'));
  if (document.fonts) document.fonts.ready.then(() => pintarFichas(true));
}
window.claude?.hot?.snapshot?.(() => soyInvitado() ? {} : {G, vista:UI.vista, setup:UI.setup});
window.claude?.hot?.ready ? window.claude.hot.ready(arrancar) : arrancar(window.claude?.hot?.data ?? {});
</script>
</body>
