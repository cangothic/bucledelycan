    ],
    tema:'algoritmos', retos:true, modo:'clasica', bote:false,
  };
}

function nuevaPartida(cfg){
  G = {
    v:2, tema:cfg.tema, sala:RED.sala,
    jugadores: cfg.jugadores.map((j, k) => ({
      nombre: j.nombre.trim() || `Jugador ${k + 1}`, ficha:j.ficha, color:COLORES[k], bot:j.bot || !!j.desconectado,
      disp:j.disp || 'anfitrion', desconectado:!!j.desconectado,
      dinero:1500, pos:0, preso:false, intentos:0, cartas:[], fuera:false,
    })),
    due:{}, turno:0, fase:'tirar', dados:[5, 2], doble:false, dobles:0, sinRepetir:false,
    mazos:{lycan:barajar(16), pausa:barajar(16)}, carta:null, oferta:null, deuda:null,
    bote:0, opc:{modo:cfg.modo, bote:cfg.bote, retos:cfg.retos !== false}, bitacora:[], msg:'', ronda:1, ranking:null, propuestas:{},
  };
  anotar(`Empieza la partida: ${G.jugadores.length} jugadores con ${money(1500)} cada uno.`);
  anotar(`Turno de ${cur().nombre}.`);
  UI.vista = 'juego'; UI.ventana = null; UI.ver = null; UI.plata = {}; UI.reto = null;
  const capa = $('#fichas'); if (capa) capa.innerHTML = '';
  guardar(); render(true);
}

async function avanzar(p, n){
  const dir = Math.sign(n);
  for (let k = 0; k < Math.abs(n); k++){
    p.pos = (p.pos + dir + 40) % 40;
    if (dir > 0 && p.pos === 0){
      p.dinero += 200;
      anotar(`${p.nombre} pasa por Comienza el bucle y cobra ${money(200)}.`);
      pintarPanel();
    }
    pintarFichas();
    emitir();
    if (PASO) await dormir(PASO);
  }
}
const irA = (p, dest) => avanzar(p, (dest - p.pos + 40) % 40);

function alBucle(p){
  p.pos = 10; p.preso = true; p.intentos = 0;
  G.dobles = 0; G.sinRepetir = true;
  anotar(`${p.nombre} queda atrapado en el bucle infinito.`);
  pintarFichas();
}

async function tirar(){
  const p = cur(), d = [r6(), r6()];
  G.dados = d; G.doble = d[0] === d[1];
  await rodarDados(d);
  const t = d[0] + d[1];
  if (p.preso){
    if (G.doble){
      p.preso = false; p.intentos = 0; G.sinRepetir = true;
      anotar(`${p.nombre} saca dobles (${d[0]} y ${d[1]}) y rompe el bucle.`);
      await avanzar(p, t);
      return caer(p, {tirada:t});
    }
    p.intentos++;
    if (p.intentos >= 3){
      G.sinRepetir = true;
      anotar(`${p.nombre} saca ${d[0]} y ${d[1]}: tercer intento sin dobles, paga ${money(50)} y sale.`);
      return cobrar(p, 50, null, 'salirBucle');
    }
    anotar(`${p.nombre} saca ${d[0]} y ${d[1]}: sigue en el bucle (intento ${p.intentos} de 3).`);
    G.fase = 'fin';
    return;
  }
  if (G.doble && ++G.dobles === 3){
    anotar(`${p.nombre} saca dobles por tercera vez seguida.`);
    alBucle(p);
    G.fase = 'fin';
    return;
  }
  anotar(`${p.nombre} saca ${d[0]} y ${d[1]}${G.doble ? ', dobles' : ''}.`);
  await avanzar(p, t);
  return caer(p, {tirada:t});
}

async function caer(p, ctx){
  const i = p.pos, c = CASILLAS[i];
  switch (c.t){
    case 'prop': case 'curso': case 'serv': {
      const d = G.due[i];
      if (!d){
        G.oferta = i; G.fase = 'comprar'; G.descuento = false; G.retoHecho = false;
        anotar(`${p.nombre} cae en ${nom(c)}: está libre y cuesta ${money(c.precio)}.`);
        return;
      }
      if (d.o === G.turno){ anotar(`${p.nombre} cae en ${nom(c)}, que es suya.`); return despues(); }
      if (d.m){ anotar(`${p.nombre} cae en ${nom(c)}, pero está hipotecada: no paga.`); return despues(); }
      let r;
      if (c.t === 'serv' && ctx.diez){
        const dd = [r6(), r6()];
        G.dados = dd;
        await rodarDados(dd);
        r = 10 * (dd[0] + dd[1]);
        anotar(`${p.nombre} tira ${dd[0]} y ${dd[1]} para la renta de ${nom(c)}.`);
      } else {
        r = renta(i, ctx.tirada || 0) * (ctx.x2 ? 2 : 1);
      }
      const q = G.jugadores[d.o].nombre;
      if (c.t === 'prop' && retosActivos()){
        if (!p.bot){
          G.pend = {monto:r, a:d.o};
          G.fase = 'renta';
          anotar(`${p.nombre} cae en ${nom(c)} de ${q}: la renta es ${money(r)}, o la mitad si gana el reto.`);
          return;
        }
        const gano = Math.random() < .6, m = gano ? Math.ceil(r / 2) : r;
        anotar(`${p.nombre} cae en ${nom(c)} de ${q} y juega el reto: ${gano ? `lo resuelve y paga la mitad, ${money(m)}` : `no lo resuelve y paga ${money(m)}`}.`);
        return cobrar(p, m, d.o, 'despues');
      }
      anotar(`${p.nombre} cae en ${nom(c)} de ${q} y le ${p.dinero >= r ? 'paga' : 'debe'} ${money(r)}.`);
      return cobrar(p, r, d.o, 'despues');
    }
    case 'impuesto':
      anotar(`${p.nombre} cae en ${c.n}: paga ${money(c.monto)}.`);
      return cobrar(p, c.monto, null, 'despues');
    case 'lycan': case 'pausa':
      return sacarCarta(p, c.t);
    case 'albucle':
      alBucle(p);
      return despues();
    case 'recreo':
      if (G.opc.bote && G.bote > 0){
        anotar(`${p.nombre} llega al recreo y se lleva el bote: ${money(G.bote)}.`);
        p.dinero += G.bote; G.bote = 0;
      } else anotar(`${p.nombre} descansa en el recreo.`);
      if (retosActivos()){
        if (!p.bot){ G.fase = 'recreo'; return; }
        if (Math.random() < .5){ p.dinero += 100; anotar(`${p.nombre} juega un reto sorpresa y cobra ${money(100)}.`); }
        else anotar(`${p.nombre} juega un reto sorpresa y no lo resuelve.`);
      }
      return despues();
    case 'bucle':
      anotar(`${p.nombre} pasa de visita por el bucle infinito.`);
      return despues();
    default:
      return despues();
  }
}

function despues(){
  const p = cur();
  if (p.fuera || G.fase === 'final') return;
  if (G.doble && !p.preso && !G.sinRepetir){
    G.fase = 'tirar';
    anotar(`${p.nombre} sacó dobles: tira otra vez.`);
  } else G.fase = 'fin';
}

function pagar(p, monto, a){
  p.dinero -= monto;
  if (a === null){ if (G.opc.bote) G.bote += monto; }
  else if (a === 'todos'){
    const otros = vivos().filter(q => q !== p);
    otros.forEach(q => q.dinero += monto / otros.length);
  }
  else G.jugadores[a].dinero += monto;
}

function cobrar(p, monto, a, sigue){
  if (monto <= 0) return seguir(sigue);
  if (p.dinero >= monto){ pagar(p, monto, a); return seguir(sigue); }
  G.deuda = {monto, a, sigue};
  G.fase = 'deuda';
  anotar(`${p.nombre} debe ${money(monto)} y tiene ${money(p.dinero)}: le toca deshacer ejercicios o hipotecar casillas.`);
}

async function seguir(s){
  if (s === 'despues') return despues();
  if (s === 'salirBucle'){
    const p = cur(), t = G.dados[0] + G.dados[1];
    p.preso = false; p.intentos = 0;
    await avanzar(p, t);
    return caer(p, {tirada:t});
  }
}

function sacarCarta(p, mazo){
  const k = G.mazos[mazo].shift();
  G.fase = 'carta';
  if (mazo === 'pausa'){
    G.carta = {mazo, k, orden:barajar(3)};
    anotar(`Pausa activa para ${p.nombre}: ${PREGUNTAS[k].q}`);
  } else {
    G.carta = {mazo, k};
    anotar(`${p.nombre} saca una carta de Idea de lycan.`);
  }
}

// Pausa activa: la respuesta correcta es siempre ops[0]; un bot acierta 6 de cada 10 veces.
function responderPausa(){
  const p = cur(), {k} = G.carta, P = PREGUNTAS[k];
  if (G.carta.elegida === undefined) G.carta.elegida = Math.random() < .6 ? 0 : 1 + Math.floor(Math.random() * 2);
  const bien = G.carta.elegida === 0;
  anotar(`${p.nombre} responde «${P.ops[G.carta.elegida]}»: ${bien ? `correcto, cobra ${money(100)}` : `no; era «${P.ops[0]}»`}.`);
  if (bien) p.dinero += 100;
  G.mazos.pausa.push(k);
  G.carta = null;
  UI.ventana = null;
  despues();
}

const masCerca = (pos, t) => { for (let k = 1; k <= 40; k++){ const i = (pos + k) % 40; if (CASILLAS[i].t === t) return i; } };

async function usarCarta(){
  const {mazo, k} = G.carta, p = cur();
  if (mazo === 'pausa') return responderPausa();
  const carta = LYCAN[k], a = carta.a;
  G.carta = null;
  UI.ventana = null;
  anotar(`Carta: ${carta.t}`);
  if (a.libre){ p.cartas.push(mazo); anotar(`${p.nombre} guarda una carta break.`); return despues(); }
  G.mazos[mazo].push(k);
  if (a.dinero > 0){ p.dinero += a.dinero; anotar(`${p.nombre} cobra ${money(a.dinero)}.`); return despues(); }
  if (a.dinero < 0){ anotar(`${p.nombre} tiene que pagar ${money(-a.dinero)}.`); return cobrar(p, -a.dinero, null, 'despues'); }
  if (a.ir !== undefined){ await irA(p, a.ir); return caer(p, {tirada:G.dados[0] + G.dados[1]}); }
  if (a.cerca){
    await irA(p, masCerca(p.pos, a.cerca));
    return caer(p, a.cerca === 'curso' ? {x2:true} : {diez:true});
  }
  if (a.atras){ await avanzar(p, -a.atras); return caer(p, {tirada:G.dados[0] + G.dados[1]}); }
  if (a.bucle){ alBucle(p); return despues(); }
  if (a.arreglo){
    const [x, y] = a.arreglo;
    let n = 0;
    deJugador(G.turno).forEach(i => { const h = G.due[i].h; n += h === 5 ? y : h * x; });
    anotar(n ? `${p.nombre} tiene que pagar ${money(n)}.` : `${p.nombre} no tiene ejercicios: no paga nada.`);
    return cobrar(p, n, null, 'despues');
  }
  if (a.cada < 0){
    const otros = vivos().length - 1;
    anotar(`${p.nombre} tiene que pagar ${money(-a.cada * otros)} en total.`);
    return cobrar(p, -a.cada * otros, 'todos', 'despues');
  }
  if (a.cada > 0){
    let s = 0;
    G.jugadores.forEach((q, i) => {
      if (q.fuera || i === G.turno) return;
      const x = Math.min(q.dinero, a.cada);
      q.dinero -= x; s += x;
    });
    p.dinero += s;
    anotar(`${p.nombre} recibe ${money(s)} de los demás.`);
    return despues();
  }
  despues();
}

function comprar(){
  const p = cur(), i = G.oferta, c = CASILLAS[i], precio = G.descuento ? Math.ceil(c.precio / 2) : c.precio;
  if (p.dinero < precio) return;
  p.dinero -= precio;
  G.due[i] = {o:G.turno, h:0, m:false};
  anotar(`${p.nombre} compra ${nom(c)} por ${money(precio)}${G.descuento ? ', a mitad de precio' : ''}.`);
  G.oferta = null; G.descuento = false; G.retoHecho = false;
  despues();
}
function noComprar(){
  anotar(`${cur().nombre} no compra ${nom(CASILLAS[G.oferta])}: sigue libre.`);
  G.oferta = null; G.descuento = false; G.retoHecho = false;
  despues();
}

function pagarBucle(){
  const p = cur();
  if (p.dinero < 50) return;
  pagar(p, 50, null);
  p.preso = false; p.intentos = 0;
  anotar(`${p.nombre} paga ${money(50)} y sale del bucle.`);
  G.fase = 'tirar';
}
function cartaBreak(){
  const p = cur(), m = p.cartas.shift();
  G.mazos[m].push(BREAK[m]);
  p.preso = false; p.intentos = 0;
  anotar(`${p.nombre} usa la carta break y sale del bucle.`);
  G.fase = 'tirar';
}

function terminarTurno(){
  G.dobles = 0; G.doble = false; G.sinRepetir = false;
  const n = G.jugadores.length;
  let k = G.turno;
  do { k = (k + 1) % n; } while (G.jugadores[k].fuera);
  if (k <= G.turno) G.ronda++;
  G.turno = k;
  const p = cur();
  G.fase = p.preso ? 'bucle' : 'tirar';
  UI.ver = null;
  anotar(`Turno de ${p.nombre}${p.preso ? ', atrapado en el bucle' : ''}.`);
}

function pagarDeuda(){
  const p = cur(), d = G.deuda;
  if (p.dinero < d.monto) return;
  pagar(p, d.monto, d.a);
  anotar(`${p.nombre} paga ${money(d.monto)}.`);
  G.deuda = null;
  return seguir(d.sigue);
}

function quiebra(){
  const pi = G.turno, p = cur(), d = G.deuda;
  const a = d && typeof d.a === 'number' ? d.a : null;
  const suyas = deJugador(pi);
  suyas.forEach(i => {
    const o = G.due[i];
    if (o.h){ p.dinero += o.h * GRUPOS[CASILLAS[i].g].casa / 2; o.h = 0; }
  });
  if (a !== null){
    const q = G.jugadores[a];
    q.dinero += Math.max(0, p.dinero);
    suyas.forEach(i => G.due[i].o = a);
    q.cartas.push(...p.cartas);
    anotar(`${p.nombre} quiebra: ${q.nombre} se queda con su dinero y sus casillas.`);
  } else {
    suyas.forEach(i => delete G.due[i]);
    p.cartas.forEach(m => G.mazos[m].push(BREAK[m]));
    anotar(`${p.nombre} quiebra: sus casillas vuelven a quedar libres.`);
  }
  p.dinero = 0; p.cartas = []; p.fuera = true; G.deuda = null;
  if (G.opc.modo === 'corta' || vivos().length <= 1) return terminar();
  terminarTurno();
}

function terminar(){
  G.ranking = G.jugadores
    .map((p, i) => ({i, v:p.fuera ? 0 : patrimonio(i), fuera:p.fuera}))
    .sort((a, b) => (a.fuera - b.fuera) || (b.v - a.v));
  G.fase = 'final';
  const w = G.jugadores[G.ranking[0].i];
  anotar(`Fin de la partida. Gana ${w.nombre}, con ${money(G.ranking[0].v)} de patrimonio.`);
  UI.ventana = {t:'final'};
}

// ---------- ejercicios, hipotecas y negocios ----------
function motivoNoEjercicio(i){
  const c = CASILLAS[i], o = G.due[i], pi = G.turno;
  if (c.t !== 'prop' || !o || o.o !== pi) return 'no';
  if (!tieneGrupo(pi, c.g)) return 'Necesitas el módulo completo';
  const gp = DEL_GRUPO[c.g];
  if (gp.some(j => G.due[j].m)) return 'Hay un episodio del módulo hipotecado';
  if (o.h >= 5) return 'Ya es un proyecto';
  if (o.h > Math.min(...gp.map(j => G.due[j].h))) return 'Parejo: primero los otros episodios del módulo';
  if (G.jugadores[pi].dinero < GRUPOS[c.g].casa) return 'No te alcanza';
  return '';
}
function sePuedeQuitar(i){
  const c = CASILLAS[i], o = G.due[i];
  if (c.t !== 'prop' || !o || o.o !== G.turno || !o.h) return false;
  return o.h === Math.max(...DEL_GRUPO[c.g].map(j => G.due[j].h));
}
function sePuedeHipotecar(i){
  const c = CASILLAS[i], o = G.due[i];
  if (!o || o.o !== G.turno || o.m) return false;
  return c.t !== 'prop' || DEL_GRUPO[c.g].every(j => !G.due[j] || !G.due[j].h);
}
const costoRecuperar = i => Math.ceil(CASILLAS[i].precio / 2 * 1.1);

function hacerEjercicio(i, callado){
  if (motivoNoEjercicio(i)) return false;
  const c = CASILLAS[i], p = cur();
  p.dinero -= GRUPOS[c.g].casa;
  const h = ++G.due[i].h;
  if (!callado) anotar(h === 5 ? `${p.nombre} convierte ${nom(c)} en un proyecto.` : `${p.nombre} hace un ejercicio de ${nom(c)} (${h} de 4).`);
  return true;
}
function quitarEjercicio(i, callado){
  if (!sePuedeQuitar(i)) return false;
  const c = CASILLAS[i], p = cur(), v = GRUPOS[c.g].casa / 2;
  G.due[i].h--;
  p.dinero += v;
  if (!callado) anotar(`${p.nombre} deshace un ejercicio de ${nom(c)} y recupera ${money(v)}.`);
  return true;
}
function hipotecar(i, callado){
  if (!sePuedeHipotecar(i)) return false;
  const c = CASILLAS[i], p = cur();
  G.due[i].m = true;
  p.dinero += c.precio / 2;
  if (!callado) anotar(`${p.nombre} hipoteca ${nom(c)} y recibe ${money(c.precio / 2)}.`);
  return true;
}
function recuperar(i){
  const o = G.due[i], c = CASILLAS[i], p = cur(), k = costoRecuperar(i);
  if (!o || !o.m || o.o !== G.turno || p.dinero < k) return;
  p.dinero -= k; o.m = false;
  anotar(`${p.nombre} levanta la hipoteca de ${nom(c)} por ${money(k)}.`);
}

const negociable = i => {
  const c = CASILLAS[i];
  return !!G.due[i] && (c.t !== 'prop' || DEL_GRUPO[c.g].every(j => !G.due[j] || !G.due[j].h));
};

function cerrarTrato(t){
  const A = G.jugadores[t.de], B = G.jugadores[t.para];
  t.doy.forEach(i => G.due[i].o = t.para);
  t.recibo.forEach(i => G.due[i].o = t.de);
  A.dinero += t.dineroRecibo - t.dineroDoy;
  B.dinero += t.dineroDoy - t.dineroRecibo;
  for (let k = 0; k < t.cartasDoy; k++) B.cartas.push(A.cartas.shift());
  for (let k = 0; k < t.cartasRecibo; k++) A.cartas.push(B.cartas.shift());
  const lista = (ps, din, car) => [
    ...ps.map(i => nom(CASILLAS[i])),
    ...(din ? [money(din)] : []),
    ...(car ? [car === 1 ? 'una carta break' : `${car} cartas break`] : []),
  ].join(', ') || 'nada';
  anotar(`Trato: ${A.nombre} da ${lista(t.doy, t.dineroDoy, t.cartasDoy)} y ${B.nombre} da ${lista(t.recibo, t.dineroRecibo, t.cartasRecibo)}.`);
}

// ---------- bots ----------
function botQuiereComprar(pi, i){
  const p = G.jugadores[pi], c = CASILLAS[i];
  if (p.dinero < c.precio) return false;
  const queda = p.dinero - c.precio;
  let clave = false;
  if (c.t === 'prop'){
    const otras = DEL_GRUPO[c.g].filter(j => j !== i);
    if (otras.every(j => duenoDe(j) === pi)) clave = true;
    const ajenas = otras.map(duenoDe).filter(o => o >= 0 && o !== pi);
    if (ajenas.length === otras.length && new Set(ajenas).size === 1) clave = true;
  }
  return queda >= 150 || (clave && queda >= 0) || (queda >= 60 && c.precio <= 160);
}

function botGestiona(pi){
  const p = G.jugadores[pi];
  deJugador(pi).forEach(i => {
    if (G.due[i].m && p.dinero - costoRecuperar(i) > 400) recuperar(i);
  });
  const hechos = {};
  for (let guard = 0; guard < 60; guard++){
    const cand = deJugador(pi)
      .filter(i => CASILLAS[i].t === 'prop' && !motivoNoEjercicio(i))
      .filter(i => p.dinero - GRUPOS[CASILLAS[i].g].casa >= 250)
      .sort((a, b) => G.due[a].h - G.due[b].h || CASILLAS[b].precio - CASILLAS[a].precio);
    if (!cand.length) break;
    hacerEjercicio(cand[0], true);
    const g = CASILLAS[cand[0]].g;
    hechos[g] = (hechos[g] || 0) + 1;
  }
  for (const g in hechos) anotar(`${p.nombre} hace ${hechos[g] === 1 ? 'un ejercicio' : hechos[g] + ' ejercicios'} en el módulo ${GRUPOS[g].k}.`);
}

function botJunta(pi, falta){
  const p = G.jugadores[pi];
  for (let guard = 0; guard < 200 && p.dinero < falta; guard++){
    const s = deJugador(pi).filter(sePuedeQuitar).sort((a, b) => G.due[b].h - G.due[a].h)[0];
    if (s !== undefined){ quitarEjercicio(s); continue; }
    const completo = i => CASILLAS[i].t === 'prop' && tieneGrupo(pi, CASILLAS[i].g) ? 1 : 0;
    const m = deJugador(pi).filter(sePuedeHipotecar).sort((a, b) => completo(a) - completo(b) || CASILLAS[a].precio - CASILLAS[b].precio)[0];
    if (m !== undefined){ hipotecar(m); continue; }
    break;
  }
}

function botAcepta(t){
  const bot = t.para, otro = t.de;
  const val = i => CASILLAS[i].precio * (G.due[i].m ? 0.5 : 1);
  let gana = t.doy.reduce((s, i) => s + val(i), 0) + t.dineroDoy + t.cartasDoy * 50;
  let pierde = t.recibo.reduce((s, i) => s + val(i), 0) + t.dineroRecibo + t.cartasRecibo * 50;
  const despues = i => t.doy.includes(i) ? bot : t.recibo.includes(i) ? otro : duenoDe(i);
  for (const g in DEL_GRUPO){
    const ps = DEL_GRUPO[g], total = ps.reduce((s, i) => s + CASILLAS[i].precio, 0);
    const completo = (f, pi) => ps.every(i => f(i) === pi);
    if (completo(despues, bot) && !completo(duenoDe, bot)) gana += total;
    if (completo(despues, otro) && !completo(duenoDe, otro)) pierde += total * .6;
  }
  return gana >= pierde * 1.05 + 10;
}

// Si al bot le falta una sola casilla de un módulo, se la pide a su dueño: con dinero
// o, si puede, cambiándola por la que le completa un módulo al otro. Cada pedido espera 4 rondas.
function botPropone(pi){
  const p = G.jugadores[pi];
  G.propuestas ||= {};
  for (const g in DEL_GRUPO){
    const ps = DEL_GRUPO[g], faltan = ps.filter(i => duenoDe(i) !== pi);
    if (faltan.length !== 1) continue;
    const j = faltan[0], q = duenoDe(j), clave = `${pi}-${j}`;
    if (q < 0 || !negociable(j)) continue;
    if (G.propuestas[clave] !== undefined && G.ronda - G.propuestas[clave] < 4) continue;
    G.propuestas[clave] = G.ronda;
    let doy = [];
    for (const g2 in DEL_GRUPO){
      if (g2 === g) continue;
      const f2 = DEL_GRUPO[g2].filter(i => duenoDe(i) !== q);
      if (f2.length === 1 && duenoDe(f2[0]) === pi && negociable(f2[0])){ doy = [f2[0]]; break; }
    }
    const trato = {de:pi, para:q, doy, recibo:[j], dineroDoy:0, dineroRecibo:0, cartasDoy:0, cartasRecibo:0};
    const tope = Math.min(p.dinero - 200, ps.reduce((s, i) => s + CASILLAS[i].precio, 0) * 1.2);
    const salto = Math.max(10, Math.round(CASILLAS[j].precio * .25 / 10) * 10);
    trato.dineroDoy = doy.length ? 0 : Math.round(CASILLAS[j].precio * 1.5 / 10) * 10;
    if (trato.dineroDoy > tope) continue;
    if (G.jugadores[q].bot){
      while (!botAcepta(trato) && trato.dineroDoy + salto <= tope) trato.dineroDoy += salto;
      if (!botAcepta(trato)) continue;
    }
    return trato;
  }
  return null;
}

function pasoBot(){
  const p = cur(), pi = G.turno;
  switch (G.fase){
    case 'bucle':
      if (p.cartas.length) return cartaBreak();
      if (p.dinero >= 250 && libres() > 8) return pagarBucle();
      return tirar();
    case 'tirar': {
      botGestiona(pi);
      const t = G.dobles === 0 ? botPropone(pi) : null;
      if (t){
        const q = G.jugadores[t.para];
        if (!q.bot){
          anotar(`${p.nombre} le propone un trato a ${q.nombre}.`);
          G.tratoPendiente = t;
          return;
        }
        anotar(`${p.nombre} le propone un trato a ${q.nombre}, que acepta.`);
        cerrarTrato(t);
        botGestiona(pi);
      }
      return tirar();
    }
    case 'comprar': {
      const c = CASILLAS[G.oferta], mitad = Math.ceil(c.precio / 2);
      if (retosActivos() && c.t === 'prop' && !G.retoHecho && p.dinero >= mitad){
        G.retoHecho = true;
        G.descuento = Math.random() < .6;
        anotar(`${p.nombre} juega el reto de ${nom(c)} y ${G.descuento ? 'lo resuelve: puede comprarlo a mitad de precio' : 'no lo resuelve'}.`);
        if (G.descuento && p.dinero - mitad >= 60) return comprar();
      }
      return botQuiereComprar(pi, G.oferta) ? comprar() : noComprar();
    }
    case 'carta': return usarCarta();
    case 'deuda':
      botJunta(pi, G.deuda.monto);
      return p.dinero >= G.deuda.monto ? pagarDeuda() : quiebra();
    case 'fin': botGestiona(pi); return terminarTurno();
    // Estas tres solo le llegan a un bot si juega por alguien que se desconectó a mitad de jugada.
    case 'renta': { const {monto, a} = G.pend; G.pend = null; return cobrar(p, monto, a, 'despues'); }
    case 'recreo': return despues();
    case 'reto': return terminarReto(Math.random() < .6);
  }
}

function responderTrato(acepta){
  const t = G.tratoPendiente;
  G.tratoPendiente = null;
  if (acepta) cerrarTrato(t);
  else anotar(`${G.jugadores[t.para].nombre} no acepta el trato.`);
}

function programarBot(){
  clearTimeout(botTimer);
  if (!G || ocupado || UI.vista !== 'juego' || G.fase === 'final' || soyInvitado()) return;
  if (G.tratoPendiente){
    // si quien tenía que responder se desconectó (ahora juega un bot en su lugar), dice que no
    if (G.jugadores[G.tratoPendiente.para].bot) botTimer = setTimeout(() => accion(() => responderTrato(false)), 900);
    return;
  }
  if (!cur().bot) return;
  const espera = {carta:2200, comprar:950, fin:550, deuda:900}[G.fase] || 750;
  botTimer = setTimeout(() => accion(pasoBot), espera);
}

// Toda jugada pasa por aquí: bloquea los botones mientras se mueve y guarda al terminar.
async function accion(fn){
  if (ocupado || !G) return;
  ocupado = true;
  clearTimeout(botTimer);
  pintarMesa();
  emitir();
  try { await fn(); }
  catch (err){ console.error(err); }
  finally {
    ocupado = false;
    if (G.fase !== 'final' && vivos().length <= 1) terminar();
    guardar();
    render();
  }
}

// ---------- retos de programación (edición Algoritmos) ----------
// Al caer en un episodio se puede jugar su reto: el algoritmo del episodio hecho juego, sin código.
// Al final salen su nombre, la idea en una frase y cómo se programa en Python.
const azar = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const mezclar = xs => barajar(xs.length).map(k => xs[k]);
const distintos = (n, a, b) => mezclar([...Array(b - a + 1).keys()].map(x => x + a)).slice(0, n);
const enOrden = xs => xs.every((x, k) => !k || xs[k - 1] < x);
const inversiones = xs => xs.reduce((s, x, i) => s + xs.slice(i + 1).filter(y => y < x).length, 0);
const conY = xs => xs.length > 1 ? `${xs.slice(0, -1).join(', ')} y ${xs.at(-1)}` : String(xs[0]);
// Paredes del laberinto como bits de cada celda: arriba 1, derecha 2, abajo 4, izquierda 8.
const DIRS = {N:[0, -1, 1, 4], E:[1, 0, 2, 8], S:[0, 1, 4, 1], O:[-1, 0, 8, 2]};
const ESTACIONES = [[30, 100], [102, 38], [102, 162], [172, 100], [242, 38], [242, 162], [312, 100]];
const VIAS = [[0, 1], [0, 2], [1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [3, 5], [2, 5], [4, 5], [4, 6], [5, 6]];
const via = (a, b) => VIAS.findIndex(([x, y]) => (x === a && y === b) || (x === b && y === a));
const COSAS = ['Carpa', 'Agua', 'Comida', 'Linterna', 'Botiquín', 'Abrigo', 'Cámara', 'Libro'];
const FRASES = [['Hoy', 'vamos', 'a', 'programar', 'en', 'Python'], ['Primero', 'lo', 'piensas', 'y', 'luego', 'programas'], ['El', 'bucle', 'de', 'lycan', 'no', 'termina']];

// La menor cantidad de monedas para un monto (programación dinámica): devuelve cuáles.
function minMonedas(monto, monedas){
  const mejor = [[]];
  for (let x = 1; x <= monto; x++){
    mejor[x] = null;
    for (const m of monedas){
      const antes = m <= x ? mejor[x - m] : null;
      if (antes && (!mejor[x] || antes.length + 1 < mejor[x].length)) mejor[x] = [...antes, m];
    }
  }
  return mejor[monto];
}

// Lo que tarda el camino más corto de la estación 0 a la 6 (Dijkstra).
function rutaMinima(peso){
  const d = [0, ...Array(6).fill(Infinity)], cerradas = new Set();
  while (cerradas.size < 7){
    let u = -1;
    for (let k = 0; k < 7; k++) if (!cerradas.has(k) && (u < 0 || d[k] < d[u])) u = k;
    cerradas.add(u);
    VIAS.forEach(([a, b], k) => {
      const v = a === u ? b : b === u ? a : -1;
      if (v >= 0 && d[u] + peso[k] < d[v]) d[v] = d[u] + peso[k];
    });
  }
  return d[6];
}

// Cada motor: crear(def) da el estado, html(estado, def) lo dibuja,
// accion(estado, qué, valor) devuelve 'gana' o 'pierde' cuando termina, y resumen(estado) lo cuenta.
const MOTORES = {
  orden:{
    crear:d => {
      const items = typeof d.items === 'function' ? d.items() : d.items;
      return {items, vista:mezclar([...items.keys()]), elegidos:[]};
    },
    html:(s, d) => `<p class="r-pide">${esc(d.pide)}</p>
      <ol class="r-orden">${s.items.map((_, k) => s.elegidos[k] === undefined ? '<li class="vacio"></li>' : `<li>${esc(s.items[s.elegidos[k]])}</li>`).join('')}</ol>
      <div class="r-fichas">${s.vista.filter(k => !s.elegidos.includes(k)).map(k => `<button type="button" class="r-ficha" data-a="r" data-r="elige" data-v="${k}">${esc(s.items[k])}</button>`).join('')}</div>
      ${s.elegidos.length ? '<p class="r-pie"><button type="button" class="link" data-a="r" data-r="borra">Empezar de nuevo</button></p>' : ''}`,
    accion:(s, r, v) => {
      if (r === 'borra'){ s.elegidos = []; return; }
      s.elegidos.push(+v);
      if (s.elegidos.length === s.items.length) return s.elegidos.every((x, k) => x === k) ? 'gana' : 'pierde';
    },
    resumen:s => s.elegidos.every((x, k) => x === k) ? 'Todo en su lugar.' : `El orden era: ${s.items.join(' → ')}.`,
  },

  opcion:{
    crear:d => ({...d.gen(), elegida:null}),
    html:s => `<p class="r-pide">${esc(s.pregunta)}</p><div class="r-fichas">${s.opciones.map((o, k) => `<button type="button" class="r-ficha" data-a="r" data-r="elige" data-v="${k}">${esc(o)}</button>`).join('')}</div>`,
    accion:(s, r, v) => { s.elegida = +v; return s.elegida === s.correcta ? 'gana' : 'pierde'; },
    resumen:s => `${s.elegida === s.correcta ? 'Exacto' : 'Era otra'}: ${s.opciones[s.correcta]}.`,
  },

  adivina:{
    crear:() => ({secreto:azar(1, 100), lo:1, hi:100, intentos:[], msg:''}),
    html:s => `<p class="r-pide">Pensé un número del 1 al 100. Tienes 7 intentos, y cada vez te digo si el mío es mayor o menor.</p>
      <div class="r-recta" aria-hidden="true"><span style="left:${s.lo - 1}%;width:${s.hi - s.lo + 1}%"></span></div>
      <p class="r-cont">Puede ser del ${s.lo} al ${s.hi} · intento ${s.intentos.length + 1} de 7</p>
      <div class="r-linea"><input id="r-num" type="number" inputmode="numeric" min="1" max="100" aria-label="Tu número"><button type="button" class="btn go sm" data-a="r" data-r="prueba">Probar</button></div>
      <ol class="r-intentos">${s.intentos.map(([n, pista]) => `<li><b>${n}</b> ${pista}</li>`).join('')}</ol>
      <p class="r-msg" role="status">${esc(s.msg)}</p>`,
    accion:s => {
      const n = Math.round(+document.getElementById('r-num').value);
      if (!(n >= 1 && n <= 100)){ s.msg = 'Escribe un número del 1 al 100.'; return; }
      s.msg = '';
      if (n === s.secreto){ s.intentos.push([n, '¡es ese!']); return 'gana'; }
      if (n < s.secreto){ s.intentos.push([n, '→ el mío es mayor']); s.lo = Math.max(s.lo, n + 1); }
      else { s.intentos.push([n, '→ el mío es menor']); s.hi = Math.min(s.hi, n - 1); }
      if (s.intentos.length >= 7) return 'pierde';
    },
    resumen:s => s.intentos.at(-1)[0] === s.secreto
      ? `Era el ${s.secreto}: lo encontraste en ${s.intentos.length} ${s.intentos.length === 1 ? 'intento' : 'intentos'}.`
      : `Era el ${s.secreto}. Preguntando siempre por el del medio, 7 intentos alcanzan para cualquier número del 1 al 100.`,
  },

  burbuja:{
    crear:() => {
      let a;
      do a = distintos(6, 1, 30); while (inversiones(a) < 5);
      return {a, cambios:0, min:inversiones(a), limite:inversiones(a) + 2};
    },
    html:s => `<p class="r-pide">Ordena las barras de menor a mayor. Solo puedes cambiar dos vecinas a la vez, y tienes ${s.limite} cambios.</p>
      <div class="r-barras">${s.a.map((x, k) => `${k ? `<button type="button" class="r-cambio" data-a="r" data-r="cambia" data-v="${k - 1}" aria-label="Cambiar ${s.a[k - 1]} y ${x}">⇄</button>` : ''}<span class="r-barra" style="--h:${x / 30}"><b>${x}</b></span>`).join('')}</div>
      <p class="r-cont">Cambios: ${s.cambios} de ${s.limite}</p>`,
    accion:(s, r, v) => {
      const k = +v;
      [s.a[k], s.a[k + 1]] = [s.a[k + 1], s.a[k]];
      s.cambios++;
      if (enOrden(s.a)) return 'gana';
      if (s.cambios >= s.limite) return 'pierde';
    },
    resumen:s => enOrden(s.a)
      ? `Ordenaste en ${s.cambios} cambios; el mínimo era ${s.min}.`
      : `Se acabaron los cambios. El mínimo era ${s.min}: cada cambio tiene que arreglar una pareja que está al revés.`,
  },

  mezcla:{
    crear:() => {
      const n = distintos(10, 1, 60);
      return {A:n.slice(0, 5).sort((x, y) => x - y), B:n.slice(5).sort((x, y) => x - y), res:[], error:null};
    },
    html:s => {
      const monton = (lado, xs) => `<div class="r-monton"><span class="r-cont">Montón ${lado}</span><div class="r-cartas">${xs.length
        ? xs.map((x, k) => k ? `<span class="r-carta">${x}</span>` : `<button type="button" class="r-carta tope" data-a="r" data-r="toma" data-v="${lado}" aria-label="Tomar el ${x} del montón ${lado}">${x}</button>`).join('')
        : '<span class="r-cont">vacío</span>'}</div></div>`;
      return `<p class="r-pide">Los dos montones ya están ordenados. Júntalos en uno solo, de menor a mayor, tomando cada vez la primera carta de uno de los dos.</p>
        ${monton('A', s.A)}${monton('B', s.B)}
        <div class="r-monton"><span class="r-cont">Tu montón</span><div class="r-cartas">${s.res.map(x => `<span class="r-carta hecha">${x}</span>`).join('') || '<span class="r-cont">vacío</span>'}</div></div>`;
    },
    accion:(s, r, v) => {
      const yo = v === 'A' ? s.A : s.B, otro = v === 'A' ? s.B : s.A;
      if (otro.length && otro[0] < yo[0]){ s.error = [yo[0], otro[0]]; return 'pierde'; }
      s.res.push(yo.shift());
      if (!s.A.length || !s.B.length){ s.res.push(...s.A, ...s.B); s.A = []; s.B = []; return 'gana'; }
    },
    resumen:s => s.error ? `Tomaste el ${s.error[0]}, pero arriba del otro montón estaba el ${s.error[1]}, que es menor.` : 'En cada paso bastó con mirar las dos primeras cartas.',
  },

  hanoi:{
    crear:() => ({t:[[3, 2, 1], [], []], sel:null, movs:0, limite:9, msg:''}),
    html:s => `<p class="r-pide">Pasa los tres discos a la torre de la derecha. Se mueve un disco a la vez, el de arriba, y nunca uno grande sobre uno chico. Tienes ${s.limite} movimientos.</p>
      <div class="r-torres">${s.t.map((discos, k) => `<button type="button" class="r-torre ${s.sel === k ? 'sel' : ''}" data-a="r" data-r="torre" data-v="${k}" aria-label="Torre ${k + 1}, con ${discos.length} discos"><span class="palo"></span>${discos.map(d => `<span class="disco d${d}"></span>`).join('')}</button>`).join('')}</div>
      <p class="r-cont">Movimientos: ${s.movs} de ${s.limite} · ${s.sel === null ? 'toca la torre de donde sale el disco' : 'ahora toca la torre de destino'}</p>
      <p class="r-msg" role="status">${esc(s.msg)}</p>`,
    accion:(s, r, v) => {
      const k = +v;
      s.msg = '';
      if (s.sel === null){ if (s.t[k].length) s.sel = k; else s.msg = 'Esa torre está vacía.'; return; }
      if (s.sel === k){ s.sel = null; return; }
      const de = s.t[s.sel], a = s.t[k];
      s.sel = null;
      if (a.length && a.at(-1) < de.at(-1)){ s.msg = 'No se puede: quedaría un disco grande sobre uno chico.'; return; }
      a.push(de.pop());
      s.movs++;
      if (s.t[2].length === 3) return 'gana';
      if (s.movs >= s.limite) return 'pierde';
    },
    resumen:s => s.t[2].length === 3
      ? `Lo lograste en ${s.movs} movimientos; el mínimo es 7.`
      : 'Se acabaron los movimientos. El truco: lleva los dos de arriba a la torre del medio, el grande a la derecha y los dos encima.',
  },

  laberinto:{
    crear:() => {
      const n = 6, m = Array(n * n).fill(15), vistas = new Set([0]), pila = [0];
      while (pila.length){
        const c = pila.at(-1), x = c % n, y = (c - x) / n;
        const libres = Object.values(DIRS).filter(([dx, dy]) => {
          const nx = x + dx, ny = y + dy;
          return nx >= 0 && ny >= 0 && nx < n && ny < n && !vistas.has(ny * n + nx);
        });
        if (!libres.length){ pila.pop(); continue; }
        const [dx, dy, b, contra] = libres[azar(0, libres.length - 1)], d = c + dx + dy * n;
        m[c] &= ~b;
        m[d] &= ~contra;
        vistas.add(d);
        pila.push(d);
      }
      const dist = {0:0}, cola = [0];
      while (cola.length){
        const c = cola.shift();
        for (const [dx, dy, b] of Object.values(DIRS)){
          if (m[c] & b) continue;
          const d = c + dx + dy * n;
          if (dist[d] === undefined){ dist[d] = dist[c] + 1; cola.push(d); }
        }
      }
      const corto = dist[n * n - 1];
      return {n, m, pos:0, rastro:[0], movs:0, corto, limite:corto * 2 + 6, msg:''};
    },
    html:s => `<p class="r-pide">Lleva al lobo hasta la salida, abajo a la derecha. Si llegas a un callejón sin salida, devuélvete hasta el último cruce y prueba otro camino. Tienes ${s.limite} pasos.</p>
      <div class="r-lab" style="--n:${s.n}">${s.m.map((w, c) => `<i class="${w & 1 ? 'n ' : ''}${w & 2 ? 'e ' : ''}${w & 4 ? 's ' : ''}${w & 8 ? 'o ' : ''}${s.rastro.includes(c) ? 'r ' : ''}${c === s.n * s.n - 1 ? 'meta' : ''}">${c === s.pos ? '<svg><use href="#lobo"/></svg>' : ''}</i>`).join('')}</div>
      <div class="r-flechas">${[['N', '↑', 'Arriba'], ['O', '←', 'Izquierda'], ['S', '↓', 'Abajo'], ['E', '→', 'Derecha']].map(([d, f, n]) => `<button type="button" class="mini" style="grid-area:${d.toLowerCase()}" data-a="r" data-r="mueve" data-v="${d}" aria-label="${n}">${f}</button>`).join('')}</div>
      <p class="r-cont">Pasos: ${s.movs} de ${s.limite} · también sirven las flechas del teclado</p>
      <p class="r-msg" role="status">${esc(s.msg)}</p>`,
    accion:(s, r, v) => {
      const [dx, dy, b] = DIRS[v];
      if (s.m[s.pos] & b){ s.msg = 'Ahí hay una pared.'; return; }
      s.msg = '';
      s.pos += dx + dy * s.n;
      s.movs++;
      if (!s.rastro.includes(s.pos)) s.rastro.push(s.pos);
      if (s.pos === s.n * s.n - 1) return 'gana';
      if (s.movs >= s.limite) return 'pierde';
    },
    resumen:s => s.pos === s.n * s.n - 1 ? `Saliste en ${s.movs} pasos; el camino directo tenía ${s.corto}.` : `Se acabaron los pasos. El camino directo tenía ${s.corto}.`,
  },

  arbol:{
    crear:() => {
      const vals = distintos(10, 1, 99).sort((a, b) => a - b), nodos = [];
      const armar = (lo, hi, prof) => {
        if (lo > hi) return -1;
        const mid = (lo + hi) >> 1, k = nodos.length;
        nodos.push({v:vals[mid], x:mid, prof, izq:-1, der:-1});
        nodos[k].izq = armar(lo, mid - 1, prof + 1);
        nodos[k].der = armar(mid + 1, hi, prof + 1);
        return k;
      };
      armar(0, vals.length - 1, 0);
      const hondos = nodos.filter(n => n.prof >= 2);
      return {nodos, meta:hondos[azar(0, hondos.length - 1)].v, actual:0, camino:[0], n:vals.length, error:false};
    },
    html:s => {
      const X = n => 20 + n.x * (300 / (s.n - 1)), Y = n => 22 + n.prof * 48;
      const lineas = s.nodos.flatMap((n, k) => [n.izq, n.der].filter(h => h >= 0).map(h =>
        `<line x1="${X(n)}" y1="${Y(n)}" x2="${X(s.nodos[h])}" y2="${Y(s.nodos[h])}" class="${s.camino.includes(k) && s.camino.includes(h) ? 'on' : ''}"/>`)).join('');
      const circulos = s.nodos.map((n, k) => `<g class="${k === s.actual ? 'act' : s.camino.includes(k) ? 'visto' : ''}"><circle cx="${X(n)}" cy="${Y(n)}" r="15"/><text x="${X(n)}" y="${Y(n)}">${n.v}</text></g>`).join('');
      return `<p class="r-pide">Busca el <b>${s.meta}</b>. En este árbol, todo lo que cuelga a la izquierda de un número es menor que él y todo lo de la derecha es mayor. Empieza arriba y baja sin equivocarte de lado.</p>
        <svg class="r-arbol" viewBox="0 0 340 196" role="img" aria-label="Árbol de números">${lineas}${circulos}</svg>
        <div class="r-linea medio"><button type="button" class="btn sm" data-a="r" data-r="izq">← Menor</button><button type="button" class="btn go sm" data-a="r" data-r="este">¡Es este!</button><button type="button" class="btn sm" data-a="r" data-r="der">Mayor →</button></div>`;
    },
    accion:(s, r) => {
      const n = s.nodos[s.actual];
      if (r === 'este'){ s.error = n.v !== s.meta; return s.error ? 'pierde' : 'gana'; }
      const bien = r === 'izq' ? s.meta < n.v : s.meta > n.v, sig = r === 'izq' ? n.izq : n.der;
      if (!bien || sig < 0){ s.error = true; return 'pierde'; }
      s.actual = sig;
      s.camino.push(sig);
    },
    resumen:s => s.error ? `Por ese lado no estaba el ${s.meta}.` : `Lo encontraste en ${s.camino.length} pasos, sin mirar los otros ${s.n - s.camino.length} números.`,
  },

  pila:{
    crear:() => ({f:FRASES[azar(0, FRASES.length - 1)], hechas:6, meta:azar(2, 4)}),
    html:s => `<p class="r-pide">Escribiste estas palabras una por una. Usa Deshacer hasta que el texto diga «${s.f.slice(0, s.meta).join(' ')}» y toca Listo.</p>
      <div class="r-doc">${s.f.slice(0, s.hechas).join(' ')}<span class="cursor"></span></div>
      <p class="r-cont">Lo que recuerda el botón de deshacer, lo último arriba:</p>
      <ol class="r-pila">${s.f.slice(0, s.hechas).map(w => `<li>escribir «${esc(w)}»</li>`).reverse().join('')}</ol>
      <div class="r-linea"><button type="button" class="btn sm" data-a="r" data-r="deshacer">Deshacer</button><button type="button" class="btn go sm" data-a="r" data-r="listo">Listo</button></div>`,
    accion:(s, r) => {
      if (r === 'deshacer'){ s.hechas--; return s.hechas < s.meta ? 'pierde' : undefined; }
      return s.hechas === s.meta ? 'gana' : 'pierde';
    },
    resumen:s => s.hechas === s.meta ? `Deshiciste ${6 - s.meta} veces, y cada vez salió lo último que había entrado.`
      : s.hechas < s.meta ? 'Te pasaste: lo que se deshace sale de la pila.' : 'Todavía faltaba deshacer.',
  },

  ruta:{
    crear:d => {
      const peso = VIAS.map(() => d.saltos ? 1 : azar(1, 9));
      const nombres = d.saltos ? mezclar(['Ana', 'Beto', 'Caro', 'Dani', 'Eli', 'Fer', 'Gabi']) : ['Alameda', 'Bosque', 'Centro', 'Dique', 'Estadio', 'Faro', 'Glorieta'];
      return {peso, nombres, camino:[0], costo:0, minimo:rutaMinima(peso), saltos:!!d.saltos, msg:''};
    },
    html:s => {
      const usadas = new Set(s.camino.slice(1).map((n, k) => via(s.camino[k], n)));
      const lineas = VIAS.map(([a, b], k) => {
        const [x1, y1] = ESTACIONES[a], [x2, y2] = ESTACIONES[b];
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${usadas.has(k) ? 'on' : ''}"/>` + (s.saltos ? '' : `<text class="peso" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2}">${s.peso[k]}</text>`);
      }).join('');
      const nodos = ESTACIONES.map(([x, y], k) => `<g class="nodo ${s.camino.includes(k) ? 'on' : ''} ${k === 6 ? 'fin' : ''}" data-a="r" data-r="nodo" data-v="${k}"><circle cx="${x}" cy="${y}" r="14"/><text x="${x}" y="${y}">${s.nombres[k][0]}</text><text class="nombre" x="${x}" y="${y < 100 ? y - 23 : y + 25}">${s.nombres[k]}</text></g>`).join('');
      return `<p class="r-pide">${s.saltos
          ? `${s.nombres[0]} quiere mandarle un mensaje a ${s.nombres[6]}, pero solo se pasa de amigo en amigo, por las líneas. Toca uno por uno a los amigos por los que pasa, con la menor cantidad de saltos.`
          : `Ve de ${s.nombres[0]} a ${s.nombres[6]} por el camino más rápido. Cada línea dice cuántos minutos tarda. Toca las estaciones una por una.`}</p>
        <svg class="r-mapa" viewBox="0 0 342 200" role="img" aria-label="Mapa">${lineas}${nodos}</svg>
        <p class="r-cont">Llevas ${s.costo} ${s.saltos ? (s.costo === 1 ? 'salto' : 'saltos') : (s.costo === 1 ? 'minuto' : 'minutos')}: ${s.camino.map(k => s.nombres[k]).join(' → ')}</p>
        <p class="r-pie"><button type="button" class="link" data-a="r" data-r="borra">Empezar de nuevo</button></p>
        <p class="r-msg" role="status">${esc(s.msg)}</p>`;
    },
    accion:(s, r, v) => {
      s.msg = '';
      if (r === 'borra'){ s.camino = [0]; s.costo = 0; return; }
      const k = +v, u = s.camino.at(-1);
      if (k === u) return;
      if (s.camino.length > 1 && k === s.camino.at(-2)){ s.costo -= s.peso[via(u, k)]; s.camino.pop(); return; }
      if (s.camino.includes(k)){ s.msg = 'Ya pasaste por ahí.'; return; }
      const w = via(u, k);
      if (w < 0){ s.msg = `No hay línea directa de ${s.nombres[u]} a ${s.nombres[k]}.`; return; }
      s.camino.push(k);
      s.costo += s.peso[w];
      if (k === 6) return s.costo === s.minimo ? 'gana' : 'pierde';
    },
    resumen:s => `Llegaste en ${s.costo} ${s.saltos ? 'saltos' : 'minutos'}${s.costo === s.minimo ? ': lo mínimo.' : `; se podía en ${s.minimo}.`}`,
  },

  cambio:{
    crear:d => {
      const c = d.gen();
      return {...c, puestas:[], mejor:minMonedas(c.monto, c.monedas), msg:''};
    },
    html:s => {
      const suma = s.puestas.reduce((a, b) => a + b, 0);
      return `<p class="r-pide">Da ${s.monto} de cambio con la menor cantidad de monedas. Hay monedas de ${conY(s.monedas)}.</p>
        <div class="r-monedas">${s.monedas.map(m => `<button type="button" class="r-moneda" data-a="r" data-r="pon" data-v="${m}" aria-label="Moneda de ${m}">${m}</button>`).join('')}</div>
        <p class="r-cont">Llevas ${suma} de ${s.monto} con ${s.puestas.length} ${s.puestas.length === 1 ? 'moneda' : 'monedas'}${s.puestas.length ? ' · toca una para quitarla' : ''}</p>
        <div class="r-monedas">${s.puestas.map((m, k) => `<button type="button" class="r-moneda chica" data-a="r" data-r="quita" data-v="${k}" aria-label="Quitar ${m}">${m}</button>`).join('')}</div>
        <div class="r-linea"><button type="button" class="btn go sm" data-a="r" data-r="listo" ${suma === s.monto ? '' : 'disabled'}>Listo</button></div>
        <p class="r-msg" role="status">${esc(s.msg)}</p>`;
    },
    accion:(s, r, v) => {
      const suma = s.puestas.reduce((a, b) => a + b, 0);
      s.msg = '';
      if (r === 'pon'){ if (suma + +v > s.monto) s.msg = 'Con esa te pasas.'; else s.puestas.push(+v); return; }
      if (r === 'quita'){ s.puestas.splice(+v, 1); return; }
      if (suma === s.monto) return s.puestas.length === s.mejor.length ? 'gana' : 'pierde';
    },
    resumen:s => s.puestas.length === s.mejor.length ? `${s.mejor.length} monedas: el mínimo.` : `Usaste ${s.puestas.length}; se podía con ${s.mejor.length}: ${s.mejor.join(' + ')}.`,
  },

  mochila:{
    crear:() => {
      let r;
      for (let t = 0; t < 80; t++){
        const cosas = mezclar(COSAS).slice(0, 5).map(n => ({n, kg:azar(1, 6), v:azar(2, 12) * 5})), cap = 10;
        let mejor = 0, cuales = 0;
        for (let m = 0; m < 32; m++){
          let kg = 0, v = 0;
          cosas.forEach((c, k) => { if (m >> k & 1){ kg += c.kg; v += c.v; } });
          if (kg <= cap && v > mejor){ mejor = v; cuales = m; }
        }
        // Que llevar primero lo que más vale por kilo no alcance, y que no quepa todo.
        let kg = 0, voraz = 0;
        [...cosas].sort((a, b) => b.v / b.kg - a.v / a.kg).forEach(c => { if (kg + c.kg <= cap){ kg += c.kg; voraz += c.v; } });
        r = {cosas, cap, mejor, cuales, elegidas:[], valor:0, msg:''};
        if (voraz < mejor && cosas.reduce((a, c) => a + c.kg, 0) > cap + 3) break;
      }
      return r;
    },
    html:s => {
      const kg = s.elegidas.reduce((a, k) => a + s.cosas[k].kg, 0), v = s.elegidas.reduce((a, k) => a + s.cosas[k].v, 0);
      return `<p class="r-pide">Vas de campamento y la mochila aguanta ${s.cap} kg. Escoge lo que más valga en total sin pasarte del peso.</p>
        <div class="r-cosas">${s.cosas.map((c, k) => `<button type="button" class="r-cosa" aria-pressed="${s.elegidas.includes(k)}" data-a="r" data-r="cosa" data-v="${k}"><b>${c.n}</b><small>${c.kg} kg · vale ${c.v}</small></button>`).join('')}</div>
        <p class="r-cont">Peso: ${kg} de ${s.cap} kg · Valor: ${v}</p>
        <div class="r-linea"><button type="button" class="btn go sm" data-a="r" data-r="listo">Listo</button></div>
        <p class="r-msg" role="status">${esc(s.msg)}</p>`;
    },
    accion:(s, r, v) => {
      s.msg = '';
      if (r === 'cosa'){
        const k = +v, ya = s.elegidas.indexOf(k);
        if (ya >= 0){ s.elegidas.splice(ya, 1); return; }
        const kg = s.elegidas.reduce((a, j) => a + s.cosas[j].kg, 0);
        if (kg + s.cosas[k].kg > s.cap){ s.msg = `No cabe: te pasarías de ${s.cap} kg.`; return; }
        s.elegidas.push(k);
        return;
      }
      s.valor = s.elegidas.reduce((a, k) => a + s.cosas[k].v, 0);
      return s.valor === s.mejor ? 'gana' : 'pierde';
    },
    resumen:s => s.valor === s.mejor ? `Valor ${s.mejor}: lo mejor que cabe.` : `Llevabas ${s.valor}; lo mejor era ${s.mejor}: ${conY(s.cosas.filter((c, k) => s.cuales >> k & 1).map(c => c.n))}.`,
  },
};

// El reto de la casilla donde cayó el jugador; en el recreo y en el proyecto final, uno sorpresa.
function empezarReto(){
  const motivo = {comprar:'compra', renta:'renta', recreo:'recreo'}[G.fase];
  if (!motivo) return;
  const i = motivo === 'compra' ? G.oferta : cur().pos, propio = CASILLAS[i].ep;
  const sorpresa = !RETOS[propio] || !!RETOS[propio].sorpresa;
  const ep = sorpresa ? SORPRESA[azar(0, SORPRESA.length - 1)] : propio;
  G.reto = {i, motivo, ep, sorpresa, n:(G.nRetos = (G.nRetos || 0) + 1)};
  G.fase = 'reto';
  UI.reto = null;
  anotar(`${cur().nombre} juega el reto${sorpresa ? ' sorpresa' : ` de ${nom(CASILLAS[i])}`}.`);
}

function jugarReto(r, v){
  const R = UI.reto;
  if (!R || R.fin || !G || G.fase !== 'reto') return;
  const res = MOTORES[R.def.tipo].accion(R.st, r, v, R.def);
  if (res) R.fin = {gano:res === 'gana'};
  pintarVentana(true);
}

function terminarReto(gano){
  const p = cur(), {motivo, i} = G.reto;
  G.reto = null;
  UI.reto = null;
  if (motivo === 'compra'){
    G.fase = 'comprar';
    G.retoHecho = true;
    G.descuento = gano;
    anotar(gano ? `${p.nombre} gana el reto: puede comprar ${nom(CASILLAS[i])} a mitad de precio.` : `${p.nombre} no gana el reto: el precio sigue igual.`);
    return;
  }
  if (motivo === 'renta'){
    const {monto, a} = G.pend, m = gano ? Math.ceil(monto / 2) : monto;
    G.pend = null;
    anotar(gano ? `${p.nombre} gana el reto y paga la mitad: ${money(m)}.` : `${p.nombre} no gana el reto y paga ${money(m)}.`);
    return cobrar(p, m, a, 'despues');
  }
  if (gano){ p.dinero += 100; anotar(`${p.nombre} gana el reto del recreo y cobra ${money(100)}.`); }
  else anotar(`${p.nombre} no gana el reto del recreo.`);
  return despues();
}

// Colores de Python para el código del final del reto.
function resaltar(codigo){
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|for|in|if|elif|else|while|import|from|not|and|or|is|None|True|False|lambda)\b|(@\w+)|\b(\d+)\b/g;
  let html = '', ultimo = 0, m;
  while ((m = re.exec(codigo))){
    html += esc(codigo.slice(ultimo, m.index));
    const tipo = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'd' : 'n';
    html += `<span class="py-${tipo}">${esc(m[0])}</span>`;
    ultimo = re.lastIndex;
  }
  return html + esc(codigo.slice(ultimo));
}

function htmlReto(){
  const R = UI.reto, d = R.def, M = MOTORES[d.tipo], {motivo, i, sorpresa} = G.reto;
  const premio = motivo === 'compra' ? `Si lo logras, compras ${esc(nom(CASILLAS[i]))} a mitad de precio.`
    : motivo === 'renta' ? `Si lo logras, pagas la mitad de la renta: ${money(Math.ceil(G.pend.monto / 2))} en vez de ${money(G.pend.monto)}.`
    : `Si lo logras, cobras ${money(100)}.`;
  const cab = `<header class="r-cab"><p class="rot">// reto${sorpresa ? ' sorpresa' : ''} · ${esc(cur().nombre)}</p><h2>${esc(d.titulo)}</h2><p class="nota">${premio}</p></header>`;
  if (!R.fin) return `<div class="ventana reto" role="dialog" aria-modal="true" aria-label="${esc(d.titulo)}">${cab}<div class="r-cuerpo">${M.html(R.st, d)}</div></div>`;
  return `<div class="ventana reto" role="dialog" aria-modal="true" aria-label="${esc(d.titulo)}">${cab}
    <div class="r-fin ${R.fin.gano ? 'si' : 'no'}"><p class="r-veredicto">${R.fin.gano ? '¡Lo lograste!' : 'Esta vez no'}</p><p>${esc(M.resumen(R.st, d))}</p></div>
    <h3>// ep. ${R.ep} · ${esc(nombreEp(R.ep))}</h3>
    <p>${esc(d.idea)}</p>
    <pre class="codigo"><code>${resaltar(d.codigo)}</code></pre>
    <div class="cerrar-fila"><button type="button" class="btn go" data-a="retoSeguir">Seguir</button></div></div>`;
}

  'ejercicio', 'quitarEjercicio', 'hipoteca', 'recuperar', 'responder', 'jugarReto', 'pagarRenta', 'seguirRecreo', 'aceptar', 'rechazar']);
// Lo que solo hace el anfitrión: preparar, empezar y terminar la partida.
const SOLO_ANFITRION = new Set(['empezar', 'nueva', 'volver', 'terminarYa', 'confirmarFin', 'ficha', 'tipo', 'agregar', 'quitar', 'modo', 'tema', 'crearSala']);

function cargarPeerJS(){
  if (window.Peer) return Promise.resolve();
  return new Promise((si, no) => {
    const s = document.createElement('script');
    s.src = PEERJS;
    s.onload = si;
    s.onerror = () => no(new Error('no se pudo cargar PeerJS; revisa la conexión a internet'));
    document.head.appendChild(s);
  });
}
// un id de PeerJS al azar (id null) o el de la sala; si no llega a abrir, se cierra
function abrirPeer(id){
  return new Promise((si, no) => {
    const peer = id ? new Peer(id, {debug:0}) : new Peer({debug:0});
    let abierto = false;
    peer.on('open', () => { abierto = true; si(peer); });
    peer.on('error', e => { if (!abierto){ peer.destroy(); no(e); } });
  });
}
const codigoSala = () => Array.from({length:5}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
const enlaceSala = () => `${location.href.split(/[?#]/)[0]}?sala=${RED.sala}`;
function avisoRed(msg){ RED.msg = msg; pintarPanel(); }

// ----- anfitrión -----
async function crearSala(codigo){
  avisoRed('Abriendo la sala…');
  try {
    await cargarPeerJS();
    for (let intento = 0; ; intento++){
      const prueba = codigo || codigoSala();
      try { RED.peer = await abrirPeer(PREFIJO_SALA + prueba); RED.sala = prueba; break; }
      catch (e){
        // código tomado: el de una sala que se recargó se espera a que el servidor lo suelte; uno al azar se cambia por otro
        if (e.type !== 'unavailable-id' || intento >= 10) throw e;
        if (codigo) await dormir(3000);
      }
    }
  } catch (e){
    return avisoRed(`No se pudo abrir la sala: ${e.message || e.type}.`);
  }
  RED.rol = 'anfitrion';
  RED.yo = 'anfitrion';
  RED.msg = '';
  RED.peer.on('connection', conn => {
    conn.visto = Date.now();
    conn.on('data', m => { conn.visto = Date.now(); mensajeDeInvitado(conn, m); });
    conn.on('close', () => invitadoSeFue(conn));
  });
  RED.peer.on('disconnected', () => { try { RED.peer.reconnect(); } catch (e) {} });
  RED.peer.on('error', e => console.warn('[sala]', e.type));
  if (G) G.sala = RED.sala;
  clearInterval(RED.reloj);
  RED.reloj = setInterval(() => {
    for (const c of [...RED.conexiones.values()]){
      if (Date.now() - c.visto > SILENCIO){ c.close(); invitadoSeFue(c); }
      else if (c.open) c.send({t:'pulso'});
    }
  }, PULSO);
  guardar();
  render();
}

function mensajeDeInvitado(conn, m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hola') return sentarInvitado(conn, m.nombre);
  if (m.t === 'jugada' && RED.conexiones.has(conn.peer)) return jugadaRemota(conn, m);
}

function sentarInvitado(conn, nombre){
  nombre = String(nombre || '').trim().slice(0, 14) || 'Invitado';
  const despedir = texto => { conn.send({t:'fuera', texto}); setTimeout(() => conn.close(), 800); };
  // el mismo navegador que vuelve tras un corte: la conexión vieja ya no sirve
  const vieja = RED.conexiones.get(conn.peer);
  if (vieja && vieja !== conn){ RED.conexiones.delete(conn.peer); vieja.close(); }
  if (G && UI.vista === 'juego' && G.fase !== 'final'){
    // con la partida empezada solo vuelve alguien que ya estaba: el mismo navegador o el mismo nombre de un desconectado
    const k = G.jugadores.findIndex(j => !j.fuera && (j.disp === conn.peer || (j.desconectado && j.nombre === nombre)));
    if (k < 0) return despedir('La partida ya empezó. Si te desconectaste, entra con el mismo nombre que tenías.');
    const j = G.jugadores[k], volvio = j.desconectado;
    const asiento = UI.setup.jugadores.find(x => x.disp === j.disp || (x.desconectado && x.nombre === j.nombre));
    if (asiento) Object.assign(asiento, {disp:conn.peer, desconectado:false});
    Object.assign(j, {disp:conn.peer, bot:false, desconectado:false});
    if (volvio) anotar(`${j.nombre} vuelve a la partida.`);
  } else {
    const s = UI.setup, vuelve = s.jugadores.find(j => j.disp === conn.peer || (j.desconectado && j.nombre === nombre));
    if (vuelve) Object.assign(vuelve, {disp:conn.peer, desconectado:false});
    else {
      if (s.jugadores.some(j => j.nombre === nombre)) nombre = `${nombre} ${s.jugadores.length + 1}`;
      if (s.jugadores.length >= 6) return despedir('La sala está llena: ya hay 6 jugadores.');
      const usadas = s.jugadores.map(j => j.ficha);
      s.jugadores.push({nombre, ficha:FICHAS.find(f => !usadas.includes(f.id)).id, bot:false, disp:conn.peer});
    }
  }
  RED.conexiones.set(conn.peer, conn);
  conn.send({t:'bienvenida', yo:conn.peer, sala:RED.sala});
  guardar();
  render();
}

// Un invitado que se va: en la partida, su asiento lo juega un bot hasta que vuelva con el mismo nombre;
// en la preparación, sale de la lista.
function invitadoSeFue(conn){
  if (RED.conexiones.get(conn.peer) !== conn) return;
  RED.conexiones.delete(conn.peer);
  if (G && UI.vista === 'juego' && G.fase !== 'final'){
    G.jugadores.forEach((j, k) => {
      if (j.disp !== conn.peer || j.fuera) return;
      j.desconectado = true;
      anotar(`${j.nombre} se desconectó. Si no vuelve en ${ESPERA / 1000} segundos, juega un bot en su lugar.`);
      esperarA(k);
    });
    UI.setup.jugadores.forEach(j => { if (j.disp === conn.peer) j.desconectado = true; });
  } else UI.setup.jugadores = UI.setup.jugadores.filter(j => j.disp !== conn.peer);
  guardar();
  render();
}

// Para la partida siguiente: cada invitado conectado tiene su asiento en la lista.
function sentarConectados(){
  if (RED.rol !== 'anfitrion' || !G) return;
  const s = UI.setup;
  G.jugadores.forEach(j => {
    if (!RED.conexiones.has(j.disp) || s.jugadores.some(x => x.disp === j.disp) || s.jugadores.length >= 6) return;
    const usadas = s.jugadores.map(x => x.ficha);
    s.jugadores.push({nombre:j.nombre, ficha:usadas.includes(j.ficha) ? FICHAS.find(f => !usadas.includes(f.id)).id : j.ficha, bot:false, disp:j.disp});
  });
}

// Pasado el plazo, si no volvió, su asiento lo juega un bot hasta que entre de nuevo.
function esperarA(k){
  const disp = G.jugadores[k].disp;
  setTimeout(() => {
    const j = G && G.jugadores[k];
    if (!j || j.disp !== disp || !j.desconectado || j.bot || j.fuera || G.fase === 'final') return;
    j.bot = true;
    anotar(`Un bot juega por ${j.nombre} hasta que vuelva.`);
    guardar();
    render();
  }, ESPERA);
}

function jugadaRemota(conn, m){
  if (!G || UI.vista !== 'juego') return;
  ACTOR = conn.peer;
  try {
    if (m.a === 'retoSeguir'){
      if (G.fase === 'reto' && esMio(G.turno)) accion(() => terminarReto(!!m.gano));
    } else if (m.a === 'proponer'){
      if (esMio(G.turno) && tratoValido(m.trato)) conn.send({t:'trato', aviso:ofrecerTrato(m.trato)});
    } else if (m.a === 'aceptar' || m.a === 'rechazar'){
      ACCIONES[m.a]();
    } else if (JUGADAS.has(m.a) && esMio(G.turno)){
      ACCIONES[m.a](m.i, m.k, m.v);
    }
  } finally {
    ACTOR = null;
    // lo que se pintó mientras jugaba el invitado se vuelve a pintar desde este equipo
    if (!ocupado) render();
  }
}

// Lo mínimo para no aceptar un trato imposible que llegue por la red.
function tratoValido(t){
  if (!t || t.de !== G.turno || !G.jugadores[t.para] || t.para === t.de || G.jugadores[t.para].fuera) return false;
  const A = G.jugadores[t.de], B = G.jugadores[t.para];
  const enteros = xs => Array.isArray(xs) && xs.every(Number.isInteger);
  return enteros(t.doy) && enteros(t.recibo)
    && t.doy.every(i => duenoDe(i) === t.de && negociable(i)) && t.recibo.every(i => duenoDe(i) === t.para && negociable(i))
    && t.dineroDoy >= 0 && t.dineroDoy <= A.dinero && t.dineroRecibo >= 0 && t.dineroRecibo <= B.dinero
    && t.cartasDoy >= 0 && t.cartasDoy <= A.cartas.length && t.cartasRecibo >= 0 && t.cartasRecibo <= B.cartas.length;
}

// El estado a todos los invitados: después de cada cambio, como mucho cada 40 ms.
let ultimaEmision = 0, emisionPendiente = null;
function emitir(){
  if (RED.rol !== 'anfitrion' || !RED.conexiones.size) return;
  const espera = 40 - (performance.now() - ultimaEmision);
  if (espera > 0){
    if (!emisionPendiente) emisionPendiente = setTimeout(() => { emisionPendiente = null; emitir(); }, espera);
    return;
  }
  ultimaEmision = performance.now();
  avisarTodos({t:'estado', G, setup:UI.setup, vista:UI.vista, ocupado, sala:RED.sala});
}
function avisarTodos(m){
  if (RED.rol !== 'anfitrion') return;
  for (const c of RED.conexiones.values()) if (c.open) c.send(m);
}

// ----- invitado -----
async function unirse(){
  const codigo = String(UI.unirse.codigo || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const nombre = String(UI.unirse.nombre || '').trim().slice(0, 14);
  if (codigo.length < 4) return avisoRed('Escribe el código de la sala.');
  if (!nombre) return avisoRed('Escribe tu nombre.');
  try { localStorage.setItem('lycanopolis.nombre', nombre); } catch (e) {}
  avisoRed(`Entrando a la sala ${codigo}…`);
  try {
    await cargarPeerJS();
    RED.peer = await abrirPeer(null);
  } catch (e){
    return avisoRed(`No se pudo conectar: ${e.message || e.type}.`);
  }
  RED.peer.on('error', e => {
    if (e.type !== 'peer-unavailable') return;
    if (RED.estado === 'entrando'){
      const codigo = RED.sala;
      salirDeSala();
      UI.unirse.codigo = codigo;
      avisoRed(`No hay ninguna sala ${codigo} abierta. Revisa el código.`);
    }
    else if (RED.anfitrion) anfitrionSeFue(RED.anfitrion);
  });
  RED.peer.on('disconnected', () => { try { RED.peer.reconnect(); } catch (e) {} });
  Object.assign(RED, {rol:'invitado', yo:RED.peer.id, sala:codigo, nombre, estado:'entrando', intentos:0});
  G = null;
  UI.vista = 'setup';
  conectarConAnfitrion();
  clearInterval(RED.reloj);
  RED.reloj = setInterval(() => {
    const c = RED.anfitrion;
    if (!c || RED.estado === 'fuera') return;
    if (c.open && Date.now() - (c.visto || 0) > SILENCIO){ c.close(); anfitrionSeFue(c); }
    else if (c.open) c.send({t:'pulso'});
  }, PULSO);
  render();
}

function conectarConAnfitrion(){
  const conn = RED.peer.connect(PREFIJO_SALA + RED.sala, {reliable:true, serialization:'json'});
  RED.anfitrion = conn;
  conn.on('open', () => { conn.visto = Date.now(); conn.send({t:'hola', nombre:RED.nombre}); });
  conn.on('data', m => { conn.visto = Date.now(); mensajeDelAnfitrion(m); });
  conn.on('close', () => anfitrionSeFue(conn));
}

function anfitrionSeFue(conn){
  if (conn !== RED.anfitrion || RED.estado === 'fuera' || !soyInvitado()) return;
  RED.anfitrion = null;
  if (RED.intentos++ >= 20){ RED.estado = 'perdida'; return avisoRed('Se perdió la conexión con la sala.'); }
  RED.estado = 'reconectando';
  avisoRed('Se perdió la conexión con la sala. Volviendo a entrar…');
  setTimeout(() => { if (soyInvitado() && !RED.anfitrion) conectarConAnfitrion(); }, 3000);
}

function mensajeDelAnfitrion(m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'bienvenida'){
    Object.assign(RED, {yo:m.yo, estado:'dentro', intentos:0, msg:''});
    return render();
  }
  if (m.t === 'fuera'){ RED.estado = 'fuera'; return avisoRed(m.texto); }
  if (m.t === 'dados') return rodarDados(m.d);
  if (m.t === 'trato'){
    if (!UI.ventana || UI.ventana.t !== 'trato') return;
    if (m.aviso){ UI.ventana.aviso = m.aviso; const el = $('#aviso'); if (el) el.textContent = m.aviso; }
    else { UI.ventana = null; pintarVentana(); }
    return;
  }
  if (m.t === 'estado'){
    const antes = G && G.fase;
    if (m.vista === 'setup' && UI.vista !== 'setup') UI.ventana = null;
    G = m.G;
    UI.setup = m.setup;
    UI.vista = m.vista;
    ocupado = m.ocupado;
    RED.sala = m.sala;
    if (G && G.fase === 'final' && antes !== 'final') UI.ventana = {t:'final'};
    if (!G || G.fase !== 'reto') UI.reto = null;
    render();
  }
}

function enviar(m){
  if (RED.anfitrion && RED.anfitrion.open) RED.anfitrion.send(m);
}

// Volver a jugar solo en este equipo. El invitado recupera su partida local; el anfitrión sigue la suya
// y los asientos de los invitados los juegan bots.
function salirDeSala(){
  const eraInvitado = soyInvitado();
  clearInterval(RED.reloj);
  for (const c of RED.conexiones.values()) c.close();
  if (RED.peer) RED.peer.destroy();
  Object.assign(RED, {rol:null, yo:'anfitrion', peer:null, sala:null, anfitrion:null, msg:'', estado:''});
  RED.conexiones.clear();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (eraInvitado){
    const guardada = cargar();
    UI.setup = (guardada && guardada.setup) || setupInicial();
    G = guardada ? guardada.G : null;
    UI.vista = 'setup';
  } else {
    UI.setup.jugadores = UI.setup.jugadores.filter(j => !j.disp || j.disp === 'anfitrion');
    if (UI.setup.jugadores.length < 2) UI.setup = setupInicial();
    if (G){
      G.sala = null;
      G.jugadores.forEach(j => { if (j.disp && j.disp !== 'anfitrion' && !j.fuera) Object.assign(j, {bot:true, desconectado:true}); });
      guardar();
    }
  }
  render(true);
}

// ---------- guardar ----------
function guardar(){
  if (soyInvitado()) return;
  try { localStorage.setItem(GUARDADO, JSON.stringify({G, vista:UI.vista, setup:UI.setup})); } catch (e){}
}
function cargar(){
  try {
    const s = JSON.parse(localStorage.getItem(GUARDADO));
    if (s && s.G && s.G.v === 2) return s;
  } catch (e){}
  return null;
}

// ---------- dibujo del tablero ----------
function celda(i){
  if (i <= 10) return [11, 11 - i];
  if (i <= 20) return [11 - (i - 10), 1];
  if (i <= 30) return [1, 1 + (i - 20)];
  return [1 + (i - 30), 11];
}

function esquina(i){
  if (i === 0) return `<span class="esq salida"><span class="el">Comienza<br>el bucle</span><svg class="ic gr"><use href="#i-bucle"/></svg><span class="es">cobra ${money(200)}</span></span>`;
  if (i === 10) return `<span class="esq carcel"><span class="celda-b"><svg class="ic"><use href="#i-bucle"/></svg><span class="el">Bucle<br>infinito</span></span><span class="es visita">solo de visita</span></span>`;
  if (i === 20) return `<span class="esq recreo"><svg class="ic gr"><use href="#i-taza"/></svg><span class="el">Recreo</span><span class="es bote"></span></span>`;
  return `<span class="esq ve"><span class="el">Ve al<br>bucle</span><svg class="ic gr"><use href="#i-flecha"/></svg><span class="es">sin cobrar ${money(200)}</span></span>`;
}

function htmlCasilla(c, i){
  const lado = i % 10 === 0 ? 'c' : i < 10 ? 'b' : i < 20 ? 'l' : i < 30 ? 't' : 'r';
  const [f, col] = celda(i);
  let dentro;
  if (lado === 'c') dentro = esquina(i);
  else if (c.t === 'prop'){
    dentro = `<span class="band" style="--g:${GRUPOS[c.g].c}"></span><span class="body"><span class="ep"><i>ep.</i>${c.ep}</span><span class="nm">${c.n}</span><span class="pr">${money(c.precio)}</span></span>`;
  } else {
    const ic = c.t === 'lycan' ? '<svg class="ic"><use href="#lobo"/></svg>'
             : `<svg class="ic"><use href="#i-${c.t === 'pausa' ? 'pausa' : c.ic}"/></svg>`;
    const pie = c.t === 'impuesto' ? `paga ${money(c.monto)}` : c.precio ? money(c.precio) : '';
    dentro = `<span class="body"><span class="nm">${c.corto || c.n}</span>${ic}<span class="pr">${pie}</span></span>`;
  }
  return `<button type="button" class="sq ${lado} t-${c.t}" style="grid-area:${f}/${col}" data-i="${i}" aria-label="${esc(nom(c))}">${dentro}</button>`;
}

function armarTablero(){
  const t = $('#tablero');
  t.innerHTML = CASILLAS.map(htmlCasilla).join('') + `
    <div class="centro">
      <div class="marca"><svg class="lobo-g"><use href="#lobo"/></svg><h1>Lycanópolis</h1><p class="tag">// edición ${CURSOS[TEMA].n}</p></div>
      <div class="mesa" id="mesa"></div>
    </div>
    <div class="fichas" id="fichas"></div>`;
  UI.cas = [...t.querySelectorAll('.sq')];
}

function pintarCasillas(){
  CASILLAS.forEach((c, i) => {
    if (!c.precio) return;
    const el = UI.cas[i], d = G && G.due[i];
    el.classList.toggle('tiene', !!d);
    el.classList.toggle('hip', !!(d && d.m));
    el.style.setProperty('--o', d ? G.jugadores[d.o].color : 'transparent');
    if (c.t === 'prop'){
      const h = d ? d.h : 0;
      el.querySelector('.band').innerHTML = h === 5 ? '<i class="proyecto"></i>' : '<i class="ejercicio"></i>'.repeat(h);
    }
  });
  UI.cas[20].querySelector('.bote').textContent = G && G.opc.bote ? `bote ${money(G.bote)}` : '';
  UI.cas.forEach((el, i) => el.classList.toggle('foco', !!G && G.fase === 'comprar' && G.oferta === i));
}

function pintarFichas(sinAnim){
  const capa = $('#fichas');
  if (!G){ capa.innerHTML = ''; return; }
  if (capa.children.length !== G.jugadores.length){
    capa.innerHTML = G.jugadores.map((p, k) => `<div class="ficha" style="--c:${p.color}" title="${esc(p.nombre)}">${icono(p.ficha)}</div>`).join('');
    sinAnim = true;
  }
  const grupos = {};
  G.jugadores.forEach((p, k) => {
    capa.children[k].hidden = p.fuera;
    if (p.fuera) return;
    const clave = p.pos === 10 ? (p.preso ? 'preso' : 'visita') : p.pos;
    (grupos[clave] ||= []).push(k);
  });
  const tam = capa.children[0].offsetWidth || 20;
  for (const clave in grupos){
    const el = UI.cas[clave === 'preso' || clave === 'visita' ? 10 : +clave];
    let x = el.offsetLeft + el.offsetWidth / 2, y = el.offsetTop + el.offsetHeight / 2;
    if (clave === 'preso'){ x += el.offsetWidth * .17; y -= el.offsetHeight * .17; }
    if (clave === 'visita'){ x -= el.offsetWidth * .32; y += el.offsetHeight * .1; }
    const ks = grupos[clave], n = ks.length, filas = Math.ceil(n / 2);
    ks.forEach((k, j) => {
      const col = n === 1 ? .5 : j % 2, fila = Math.floor(j / 2);
      const ox = (col - .5) * tam * .95, oy = (fila - (filas - 1) / 2) * tam * .95;
      const f = capa.children[k];
      f.classList.toggle('sin-anim', !!sinAnim);
      f.classList.toggle('act', k === G.turno && G.fase !== 'final');
      f.style.transform = `translate(${x + ox - tam / 2}px, ${y + oy - tam / 2}px)`;
    });
  }
}

const CARAS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
const dadoHTML = v => `<span class="dado">${[...Array(9).keys()].map(k => `<i${CARAS[v].includes(k) ? ' class="p"' : ''}></i>`).join('')}</span>`;

async function rodarDados(d){
  avisarTodos({t:'dados', d});
  const box = $('#mesa .dados');
  if (box && !SIN_MOV){
    box.classList.add('rodando');
    for (let k = 0; k < 7; k++){ box.innerHTML = dadoHTML(r6()) + dadoHTML(r6()); await dormir(60); }
    box.classList.remove('rodando');
  }
  if (box){ box.innerHTML = dadoHTML(d[0]) + dadoHTML(d[1]); box.setAttribute('aria-label', `Dados: ${d[0]} y ${d[1]}`); }
}

function htmlCasillasDe(pi){
  const p = G.jugadores[pi], mias = deJugador(pi);
  const gestiona = pi === G.turno && puedeGestionar();
  if (!mias.length) return `<p class="vacio">${pi === G.turno && esMio(pi) ? 'Todavía no tienes casillas.' : `${esc(p.nombre)} todavía no tiene casillas.`}</p>`;
  const bloques = [
    ...Object.keys(GRUPOS).map(g => ({clave:g, titulo:`Módulo ${GRUPOS[g].k} · ${GRUPOS[g].n}`, color:GRUPOS[g].c, ps:DEL_GRUPO[g]})),
    {clave:'curso', titulo:'Cursos', color:'var(--lavanda)', ps:CASILLAS.map((c, i) => c.t === 'curso' ? i : -1).filter(i => i >= 0)},
    {clave:'serv', titulo:'Papel y lápiz y Python', color:'var(--ink-100)', ps:[12, 28]},
  ];
  let html = '';
  for (const b of bloques){
    const tiene = b.ps.filter(i => duenoDe(i) === pi);
    if (!tiene.length) continue;
    html += `<div class="grp"><span class="sw" style="--g:${b.color}"></span>${b.titulo}<small>${tiene.length}/${b.ps.length}</small></div>`;
    for (const i of tiene){
      const c = CASILLAS[i], o = G.due[i];
      const marcas = o.h === 5 ? '<span class="v">proyecto</span>' : o.h ? `<span class="s">${'▮'.repeat(o.h)}</span>` : '';
      let ops = '';
      if (gestiona){
        if (c.t === 'prop' && tieneGrupo(pi, c.g) && !o.m){
          const motivo = motivoNoEjercicio(i), casa = GRUPOS[c.g].casa;
          if (o.h < 5) ops += `<button type="button" class="mini" data-a="ejercicio" data-i="${i}" ${motivo ? `disabled title="${esc(motivo)}"` : ''}>${o.h === 4 ? 'Proyecto' : '+ ejercicio'} ${money(casa)}</button>`;
          if (o.h) ops += `<button type="button" class="mini" data-a="quitarEjercicio" data-i="${i}" ${sePuedeQuitar(i) ? '' : 'disabled title="Parejo: primero los que tienen más"'}>− ejercicio +${money(casa / 2)}</button>`;
        }
        if (o.m) ops += `<button type="button" class="mini" data-a="recuperar" data-i="${i}" ${p.dinero < costoRecuperar(i) ? 'disabled title="No te alcanza"' : ''}>Recuperar ${money(costoRecuperar(i))}</button>`;
        else ops += `<button type="button" class="mini" data-a="hipoteca" data-i="${i}" ${sePuedeHipotecar(i) ? '' : 'disabled title="Primero deshaz los ejercicios del módulo"'}>Hipotecar +${money(c.precio / 2)}</button>`;
      }
      html += `<div class="hold ${o.m ? 'hip' : ''}"><button type="button" class="hn" data-i="${i}">${nom(c)}<small>${o.m ? 'hipotecada' : ''}${marcas}</small></button>${ops ? `<span class="ops">${ops}</span>` : ''}</div>`;
    }
  }
  return html;
}

    cab = `<div class="cab oscura" style="--g:var(--lavanda)"><svg class="ic"><use href="#i-${c.ic}"/></svg><p class="rot">// curso del canal</p><h2>${c.n}</h2></div>`;
    filas = [['Con 1 curso', '$25'], ['Con 2 cursos', '$50'], ['Con 3 cursos', '$100'], ['Con los 4', '$200']];

  } else if (c.t === 'serv'){
    cab = `<div class="cab oscura" style="--g:var(--ink-50)"><svg class="ic"><use href="#i-${c.ic}"/></svg><p class="rot">// ${esc(c.sub.toLowerCase())}</p><h2>${c.n}</h2></div>`;
    filas = [['Con uno de los dos', '4 × los dados'], ['Con Papel y lápiz y Python', '10 × los dados']];
    if (d && !d.m) ahora = cuantos(d.o, 'serv') - 1;
    letra = `Si lo hipotecas, recibes ${money(75)}.`;

    const ic = c.t === 'lycan' ? '#lobo' : c.ic ? `#i-${c.ic}` : {salida:'#i-bucle', bucle:'#i-bucle', pausa:'#i-pausa', recreo:'#i-taza', albucle:'#i-flecha'}[c.t];

    return `<div class="ventana titulo" role="dialog" aria-modal="true" aria-label="${esc(nom(c))}"><div class="cab oscura" style="--g:${color}"><svg class="ic"><use href="${ic}"/></svg><h2>${nom(c)}</h2></div>
      <div class="cuerpo"><p>${esc(c.d)}</p><div class="cerrar-fila"><button type="button" class="btn ghost sm" data-a="cerrar">Cerrar</button></div></div></div>`;

    ? `<p class="dueno">${fichaMini(G.jugadores[d.o])}<span>De <b>${esc(G.jugadores[d.o].nombre)}</b>${d.m ? ' · hipotecada' : ''}</span></p>`
    : `<p class="dueno">Libre · cuesta <b>${money(c.precio)}</b></p>`;

}

function htmlReglas(){
  return `<div class="ventana reglas" role="dialog" aria-modal="true" aria-labelledby="reglas-t">
    <h2 id="reglas-t">Cómo se juega</h2>
    <p>Un monopolio para aprender: el tablero es ${TEMAS_ABIERTOS.length === 1 ? `el curso de ${CURSOS[TEMAS_ABIERTOS[0]].n}` : 'uno de los cursos del canal'} y las cartas son lo que se enseña en sus episodios. Cada jugador empieza con ${money(1500)} y gana quien deja a los demás sin dinero.</p>
    <h3>// lo que se aprende</h3>
    <ul>
      <li><b>Pausa activa:</b> una pregunta de un episodio con tres respuestas. Si aciertas, cobras ${money(100)}; aciertes o no, la carta explica por qué.</li>
      <li><b>Idea de lycan:</b> algo que suena lógico y no lo es (son las frases de lycan en los episodios). La carta dice por qué está mal y lo que te pasa por creerlo.</li>
      <li><b>Casillas de color:</b> cada una es un episodio del curso, y cada color es un módulo, en el orden del curso: del 1 (cobre, el más barato) al 8, el proyecto final (azul). Toca una casilla para ver de qué trata.</li>
    </ul>
    <h3>// retos de programación (edición Algoritmos)</h3>
    <p>Cada episodio tiene un reto que se juega sin saber programar: adivinar un número, ordenar con vecinas, las Torres de Hanoi, salir de un laberinto, dar el cambio… Si caes en un episodio libre y ganas su reto, lo compras a mitad de precio; si tiene dueño, pagas la mitad de la renta. En el recreo, un reto sorpresa vale ${money(100)}. Al terminar ves cómo se llama el algoritmo y cómo se programa en Python. Se pueden apagar al preparar la partida.</p>
    <h3>// tu turno</h3>
    <ol>
      <li>Tira los dados y avanza. Cada vez que pasas por <b>Comienza el bucle</b> cobras ${money(200)}.</li>
      <li>Si la casilla está libre, puedes comprarla. Si no la compras, sigue libre: no hay subastas.</li>
      <li>Si tiene dueño, le pagas la renta.</li>
      <li>Si sacas dobles, tiras otra vez. Tres dobles seguidos te mandan al bucle infinito.</li>
    </ol>
    <h3>// el tablero</h3>
    <ul>
      <li><b>Cursos:</b> las cuatro estaciones son los otros cursos del canal. Con uno cobras $25; con dos, $50; con tres, $100, y con los cuatro, $200.</li>
      <li><b>Papel y lápiz y Python:</b> primero se piensa, después se programa. Quien cae paga 4 veces lo que sacó en los dados, o 10 veces si el dueño tiene los dos.</li>
      <li><b>Un bug y Error de redondeo:</b> los impuestos.</li>
      <li><b>Bucle infinito:</b> la cárcel. Sales si sacas dobles, si pagas ${money(50)} o con una carta break. Al tercer intento sin dobles pagas y sales.</li>
      <li><b>Recreo:</b> un descanso. Con el bote activado, ahí se juntan los impuestos y las multas para quien caiga.</li>
    </ul>
    <h3>// ejercicios y proyectos</h3>
    <p>Con el módulo completo cobras el doble y puedes hacer <b>ejercicios</b> (las casas): hasta cuatro por episodio, y uno más lo convierte en <b>proyecto</b> (el hotel). Se hacen parejo: un episodio no puede tener dos ejercicios más que otro del mismo módulo.</p>
    <h3>// la hipoteca</h3>
    <p>Si te falta dinero, hipoteca una casilla y recibe la mitad de su precio. Mientras está hipotecada no cobra renta. Para recuperarla pagas lo que recibiste más el 10 %. Antes hay que deshacer los ejercicios del módulo, que se devuelven por la mitad.</p>
    <h3>// deudas y quiebra</h3>
    <p>Si no te alcanza para pagar, deshaz ejercicios o hipoteca casillas. Si ni así juntas el dinero, quiebras: lo que tengas pasa a quien le debías, o vuelve a quedar libre si le debías al banco.</p>
    <h3>// negociar</h3>
    <p>En tu turno puedes cambiar casillas, dinero y cartas break con otro jugador. Los bots aceptan si el trato les conviene.</p>
    <h3>// modos</h3>
    <p><b>Clásica:</b> se juega hasta que queda uno. <b>Corta:</b> termina con la primera quiebra y gana quien tenga más patrimonio (dinero, casillas y ejercicios).</p>
    <div class="cerrar-fila"><button type="button" class="btn go sm" data-a="cerrar">Entendido</button></div></div>`;
}

function htmlTrato(){

  return `<div class="ventana trato" role="dialog" aria-modal="true" aria-labelledby="trato-t">
    <h2 id="trato-t">Negociar</h2>
    <div class="otros" role="group" aria-label="Con quién">${otros}</div>
    <div class="lados">
      <div class="lado"><h3>// ${esc(A.nombre)} da</h3><div class="props">${lista(yo, 'doy')}</div>
        <label class="campo">Dinero (tiene ${money(A.dinero)})<input type="number" min="0" max="${A.dinero}" step="10" data-campo="dineroDoy" value="${t.dineroDoy}"></label>${campoCartas(A, 'cartasDoy')}</div>
      <div class="lado"><h3>// ${esc(B.nombre)} da</h3><div class="props">${lista(t.para, 'recibo')}</div>
        <label class="campo">Dinero (tiene ${money(B.dinero)})<input type="number" min="0" max="${B.dinero}" step="10" data-campo="dineroRecibo" value="${t.dineroRecibo}"></label>${campoCartas(B, 'cartasRecibo')}</div>
    </div>
    <p class="aviso" id="aviso" role="status">${esc(t.aviso || '')}</p>
    <div class="cerrar-fila"><button type="button" class="btn ghost sm" data-a="cerrar">Cancelar</button><button type="button" class="btn go sm" data-a="proponer">Proponer a ${esc(B.nombre)}</button></div></div>`;
}
