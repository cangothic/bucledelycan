<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--artefacto-->
<title>Lycanópolis</title>
<meta name="description" content="El monopolio de El bucle de lycan para aprender algoritmos jugando: 20 retos de programación que se juegan sin saber programar. Gratis en el navegador, en un mismo equipo o en línea.">
<meta property="og:title" content="Lycanópolis · El bucle de lycan">
<meta property="og:description" content="Un monopolio para aprender algoritmos jugando, con 20 retos de programación que se juegan sin saber programar.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Un solo tema, a propósito: el neón del canal sobre tinta (marca/README.md).
   Tablero 11 × 11 a la izquierda y panel del turno a la derecha; en el celular, uno debajo del otro. */
:root{
  color-scheme:dark;
  --ink-950:#04060C; --ink-900:#070B14; --ink-800:#0C1322; --ink-700:#131C30; --ink-600:#1C2740;
  --ink-500:#2A3756; --ink-400:#45547A; --ink-300:#7584A8; --ink-200:#A9B6D3; --ink-100:#D6DFF0; --ink-50:#EEF3FC;
  --cyan-500:#22D3FF; --cyan-400:#5BE0FF; --magenta-500:#FF2E9A; --magenta-400:#FF66B5;
  --violet-500:#A78BFA; --lavanda:#C4B1FF; --green-500:#3CF0A5; --red-500:#FF4D5E; --cyan-700:#0A7FA8; --oro:#FFC94D;
  --rejilla:rgba(34,211,255,.045);
  --font-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--ink-950);color:var(--ink-100);
  font-family:var(--font-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--rejilla) 1px,transparent 1px),linear-gradient(90deg,var(--rejilla) 1px,transparent 1px);
  background-size:32px 32px;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan-500);outline-offset:2px}
.app{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:20px;align-items:start;
  max-width:1320px;margin:0 auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.zona{display:flex;justify-content:center;min-width:0}

/* ---------- tablero ---------- */
.tablero{
  position:relative;width:min(100%,calc(100dvh - 40px));min-width:0;aspect-ratio:1;
  container:tablero/inline-size;
  display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
  gap:2px;padding:2px;background:var(--ink-600);border:1px solid rgba(34,211,255,.45);border-radius:6px;
  box-shadow:0 0 0 1px rgba(34,211,255,.08),0 0 70px -10px rgba(34,211,255,.28);
}
.sq{
  position:relative;display:flex;min-width:0;min-height:0;overflow:hidden;padding:0;border:0;
  background:var(--ink-800);cursor:pointer;text-align:center;
}
.sq:hover{background:var(--ink-700)}
.sq.b{flex-direction:column}
.sq.t{flex-direction:column-reverse}
.sq.l{flex-direction:row-reverse}
.sq.r{flex-direction:row}
.band{
  flex:0 0 22%;background:var(--g);display:flex;align-items:center;justify-content:center;gap:5%;
  box-shadow:0 0 14px -3px var(--g);
}
.sq.l .band,.sq.r .band{flex-direction:column}
.body{
  flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:2px;padding:7% 6%;
}
.ep{font-family:var(--font-mono);font-size:1.02cqi;color:var(--ink-300);letter-spacing:.02em;line-height:1}
.ep i{font-style:normal}
.nm{font-size:1.24cqi;font-weight:600;line-height:1.12;color:var(--ink-50);text-wrap:balance;overflow-wrap:break-word;max-width:100%}
.pr{font-family:var(--font-display);font-weight:600;font-size:1.3cqi;color:var(--ink-200);line-height:1;font-variant-numeric:tabular-nums}
.sq .ic{width:3.3cqi;height:3.3cqi;flex:0 0 auto}
.t-curso .ic{color:var(--lavanda);filter:drop-shadow(0 0 4px rgba(196,177,255,.6))}
.t-curso .nm{color:var(--lavanda)}
.t-serv .ic{color:var(--ink-50);filter:drop-shadow(0 0 4px rgba(214,223,240,.45))}
.t-impuesto .ic{color:var(--ink-200)}
.t-impuesto .pr{font-family:var(--font-mono);font-weight:400;font-size:1.05cqi}
.t-lycan .nm{color:var(--magenta-400)}
.t-lycan .ic{width:4cqi;height:4cqi;filter:drop-shadow(0 0 5px rgba(255,46,154,.55))}
.t-pausa .nm{color:var(--cyan-400)}
.t-pausa .ic{color:var(--cyan-500);filter:drop-shadow(0 0 5px rgba(34,211,255,.55))}
.band .ejercicio{width:9%;height:58%;max-width:9px;border-radius:2px;background:var(--ink-950);box-shadow:inset 0 0 0 1.5px var(--ink-50)}
.sq.l .band .ejercicio,.sq.r .band .ejercicio{width:58%;height:9%;max-width:none;max-height:9px}
.band .proyecto{width:42%;height:62%;border-radius:3px;background:var(--magenta-500);box-shadow:0 0 0 1.5px var(--ink-950),0 0 10px var(--magenta-500)}
.sq.l .band .proyecto,.sq.r .band .proyecto{width:62%;height:42%}
/* dueño: franja del color del jugador en el borde de fuera */
.sq.tiene::after{content:"";position:absolute;background:var(--o);box-shadow:0 0 8px var(--o)}
.sq.b.tiene::after{left:0;right:0;bottom:0;height:4px}
.sq.t.tiene::after{left:0;right:0;top:0;height:4px}
.sq.l.tiene::after{top:0;bottom:0;left:0;width:4px}
.sq.r.tiene::after{top:0;bottom:0;right:0;width:4px}
.sq.hip{background:repeating-linear-gradient(-45deg,var(--ink-800) 0 5px,var(--ink-700) 5px 10px)}
.sq.hip .body,.sq.hip .band{opacity:.38}
.sq.foco{background:var(--ink-700);box-shadow:inset 0 0 0 2px var(--cyan-500),inset 0 0 22px rgba(34,211,255,.35)}

/* esquinas */
.esq{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:8%}
.esq .el{font-family:var(--font-display);font-weight:700;font-size:1.5cqi;line-height:1.05;text-transform:uppercase;letter-spacing:.04em}
.esq .es{font-family:var(--font-mono);font-size:1.05cqi;color:var(--ink-300)}
.esq .gr{width:6.6cqi;height:6.6cqi}
.salida .el,.salida .gr{color:var(--cyan-500)}
.salida .gr{filter:drop-shadow(0 0 6px rgba(34,211,255,.8))}
.recreo .el{color:var(--ink-50)}
.recreo .gr{color:var(--violet-500);filter:drop-shadow(0 0 6px rgba(167,139,250,.7))}
.recreo .bote{color:var(--green-500)}
.ve .el,.ve .gr{color:var(--magenta-500)}
.ve .gr{filter:drop-shadow(0 0 6px rgba(255,46,154,.8))}
.carcel{padding:0}
.carcel .celda-b{
  position:absolute;top:0;right:0;width:66%;height:66%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;
  border-left:2px solid var(--magenta-500);border-bottom:2px solid var(--magenta-500);
  background:repeating-linear-gradient(90deg,rgba(255,46,154,.09) 0 2px,transparent 2px 18%),rgba(255,46,154,.06);
  box-shadow:0 0 14px -4px var(--magenta-500);
}
.carcel .celda-b .ic{width:4.2cqi;height:4.2cqi;color:var(--magenta-500)}
.carcel .celda-b .el{color:var(--magenta-400);font-size:1.25cqi}
.carcel .visita{position:absolute;left:0;right:34%;bottom:6%;text-align:center}

/* centro */
.centro{
  grid-column:2/11;grid-row:2/11;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(255,46,154,.11),transparent 58%),var(--ink-900);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqi;padding:4cqi;text-align:center;
}
.marca{display:flex;flex-direction:column;align-items:center;gap:.6cqi}
.marca .lobo-g{width:8cqi;height:8.4cqi;filter:drop-shadow(0 0 10px rgba(255,46,154,.45))}
.marca h1{
  margin:0;font-family:var(--font-display);font-weight:700;font-size:5.6cqi;line-height:1;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-50);text-shadow:0 0 18px rgba(255,46,154,.6),0 0 2px rgba(255,46,154,.9);
}
.marca .tag{margin:0;font-family:var(--font-mono);font-size:1.45cqi;color:var(--cyan-500)}
.tiro{display:flex;align-items:center;justify-content:center;gap:3.6cqi}
.mazo{
  flex:0 0 auto;width:9.6cqi;aspect-ratio:.7;border-radius:1cqi;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqi;
  font-family:var(--font-display);font-weight:600;font-size:1.05cqi;line-height:1.1;text-transform:uppercase;letter-spacing:.05em;
  background:var(--ink-800);
}
.mazo svg{width:4.2cqi;height:4.2cqi}
.m-lycan{transform:rotate(-8deg);color:var(--magenta-400);border:1px solid var(--magenta-500);box-shadow:0 0 18px -4px var(--magenta-500),.7cqi .7cqi 0 -.2cqi var(--ink-700)}
.m-pa{transform:rotate(8deg);color:var(--cyan-400);border:1px solid var(--cyan-500);box-shadow:0 0 18px -4px var(--cyan-500),-.7cqi .7cqi 0 -.2cqi var(--ink-700)}
.m-pa svg{color:var(--cyan-500)}
.mesa{display:flex;flex-direction:column;align-items:center;gap:1.5cqi;max-width:58cqi}
.dados{display:flex;gap:2cqi}
.dado{
  width:7cqi;height:7cqi;border-radius:1.3cqi;background:var(--ink-50);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:1cqi;box-shadow:0 0 16px -2px rgba(34,211,255,.55),inset 0 -.4cqi 0 rgba(4,6,12,.18);
}
.dado i{display:block;width:1.3cqi;height:1.3cqi;border-radius:50%;place-self:center}
.dado i.p{background:var(--ink-950)}
.dados.rodando .dado{animation:sacude .12s linear infinite alternate}
@keyframes sacude{from{transform:rotate(-9deg) translateY(-2%)}to{transform:rotate(9deg) translateY(2%)}}
.turno{margin:0;display:flex;align-items:center;gap:1cqi;font-size:max(12px,1.75cqi);color:var(--ink-200)}
.turno .ficha-mini{width:max(18px,3cqi);height:max(18px,3cqi)}
.msg{margin:0;font-size:max(11.5px,1.65cqi);color:var(--ink-100);line-height:1.35;text-wrap:balance;min-height:2.7em}
.acciones{display:flex;flex-direction:column;align-items:center;gap:1.2cqi}
.fila{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2cqi}
.nota{margin:0;font-size:max(11px,1.45cqi);color:var(--ink-300);line-height:1.35;text-wrap:balance}
.pensando{margin:0;font-family:var(--font-mono);font-size:max(11px,1.45cqi);color:var(--cyan-400)}
.pensando::after{content:"▍";animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.mini-tit{
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:1.2cqi;align-items:center;text-align:left;
  background:var(--ink-800);border:1px solid var(--ink-500);border-radius:1cqi;padding:1.1cqi 1.6cqi;cursor:pointer;max-width:100%;
}
.mini-tit .b{grid-row:1/3;width:1.4cqi;height:100%;min-height:4cqi;border-radius:.4cqi;background:var(--g);box-shadow:0 0 10px var(--g)}
.mini-tit .n{font-weight:600;font-size:max(12px,1.75cqi);color:var(--ink-50);line-height:1.15}
.mini-tit .r{font-family:var(--font-mono);font-size:max(10.5px,1.35cqi);color:var(--ink-300)}

/* fichas */
.fichas{position:absolute;inset:0;pointer-events:none;z-index:5}
.ficha{
  position:absolute;left:0;top:0;width:4.3cqi;height:4.3cqi;border-radius:50%;
  display:grid;place-items:center;background:var(--ink-950);border:2px solid var(--c);color:var(--c);
  box-shadow:0 0 0 1px var(--ink-950),0 0 10px -1px var(--c);
  transition:transform .13s var(--ease-out);
}
.ficha.sin-anim{transition:none}
.ficha svg{width:68%;height:68%}
.ficha.act{animation:late 1.3s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 0 1px var(--ink-950),0 0 18px 3px var(--c)}}
.ficha-mini{
  display:inline-grid;place-items:center;flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  background:var(--ink-950);border:2px solid var(--c);color:var(--c);box-shadow:0 0 8px -2px var(--c);
}
.ficha-mini svg{width:68%;height:68%}

/* celular: el tablero solo dice el número de episodio; el nombre sale al tocar la casilla */
@container tablero (max-width:560px){
  .nm,.esq .es{display:none}
  .marca .tag{font-size:2.4cqi;max-width:60cqi;text-wrap:balance}
  .ep{font-size:2.15cqi;color:var(--ink-100);font-weight:500}
  .ep i{display:none}
  .pr{font-size:1.95cqi}
  .t-impuesto .pr{font-size:1.7cqi}
  .sq .ic{width:4.6cqi;height:4.6cqi}
  .t-lycan .ic{width:5cqi;height:5cqi}
  .esq .el{font-size:1.85cqi}
  .carcel .celda-b .el{font-size:1.55cqi}
  .body{padding:8% 4%}
  .mazo{display:none}
  .marca .lobo-g{display:none}
  .marca h1{font-size:6.6cqi}
  .dado{width:8.4cqi;height:8.4cqi}
  .dado i{width:1.6cqi;height:1.6cqi}
  .ficha{width:5cqi;height:5cqi}
  .mesa{max-width:66cqi;gap:2cqi}
  .centro{gap:3.4cqi}
}

/* botones */
.btn{
  font-family:var(--font-display);font-weight:600;font-size:max(12.5px,1.8cqi);letter-spacing:.03em;line-height:1.1;
  padding:.72em 1.25em;border-radius:6px;cursor:pointer;color:var(--ink-50);
  border:1px solid var(--cyan-500);background:rgba(34,211,255,.10);box-shadow:0 0 16px -6px var(--cyan-500);
  transition:background .15s,box-shadow .15s,transform .1s;
}
.btn:hover:not(:disabled){background:rgba(34,211,255,.2);box-shadow:0 0 20px -4px var(--cyan-500)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.go{background:var(--cyan-500);color:var(--ink-950);box-shadow:0 0 22px -4px var(--cyan-500)}
.btn.go:hover:not(:disabled){background:var(--cyan-400)}
.btn.alt{border-color:var(--magenta-500);background:rgba(255,46,154,.12);box-shadow:0 0 16px -6px var(--magenta-500)}
.btn.alt:hover:not(:disabled){background:rgba(255,46,154,.22)}
.btn.ghost{border-color:var(--ink-400);background:transparent;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--ink-700)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel .btn{font-size:14px}
.btn.sm{font-size:13px !important;padding:.55em 1em}

/* ---------- panel ---------- */
.panel{
  min-width:0;display:flex;flex-direction:column;gap:20px;padding:18px;border-radius:10px;
  background:rgba(7,11,20,.92);border:1px solid var(--ink-600);
}
.ph{display:flex;align-items:center;gap:12px}
.ph svg{width:38px;height:40px;flex:0 0 auto}
.ph h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-50);line-height:1.1}
.ph p{margin:2px 0 0;font-family:var(--font-mono);font-size:12px;color:var(--ink-300)}
.panel h3{margin:0 0 10px;font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.03em;color:var(--cyan-500)}
.panel section{min-width:0}
.jug{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.jug li{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;
}
.jug li:hover{background:var(--ink-800)}
.jug li.act{background:rgba(34,211,255,.07);border-color:rgba(34,211,255,.35)}
.jug li.visto:not(.act){border-color:var(--ink-500)}
.jug li.out{opacity:.42}
.jug li.out .jn{text-decoration:line-through}
.jn{font-weight:600;color:var(--ink-50);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{font-family:var(--font-mono);font-size:10.5px;line-height:1.5;padding:0 6px;border-radius:999px;border:1px solid var(--ink-500);color:var(--ink-200)}
.chip.bucle{border-color:var(--magenta-500);color:var(--magenta-400)}
.chip.brk{border-color:var(--green-500);color:var(--green-500)}
.plata{font-family:var(--font-display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink-50);border-radius:4px;padding:0 4px}
.plata.sube{animation:sube 1s var(--ease-out)}
.plata.baja{animation:baja 1s var(--ease-out)}
@keyframes sube{from{color:var(--green-500);background:rgba(60,240,165,.18)}}
@keyframes baja{from{color:var(--red-500);background:rgba(255,77,94,.18)}}
.grp{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:12.5px;color:var(--ink-300)}
.grp:first-child{margin-top:0}
.grp small{margin-left:auto;font-family:var(--font-mono);font-size:11px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--g);box-shadow:0 0 8px var(--g);flex:0 0 auto}
.hold{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 0;border-bottom:1px solid var(--ink-700)}
.hold .hn{flex:1 1 150px;min-width:0;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink-50);font-size:14px}
.hold .hn:hover{color:var(--cyan-400)}
.hold.hip .hn{color:var(--ink-300)}
.hold .hn small{font-family:var(--font-mono);font-size:11px;color:var(--ink-300);margin-left:6px}
.hold .hn .s{color:var(--cyan-400)}
.hold .hn .v{color:var(--magenta-400)}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.mini{
  font-size:12px;line-height:1.2;padding:5px 8px;border-radius:5px;cursor:pointer;
  border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-100);font-variant-numeric:tabular-nums;
}
.mini:hover:not(:disabled){border-color:var(--cyan-500);color:var(--ink-50)}
.mini:disabled{opacity:.32;cursor:not-allowed}
.vacio{margin:0;color:var(--ink-300);font-size:14px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:230px;overflow:auto;font-family:var(--font-mono);font-size:12px;line-height:1.45;color:var(--ink-300)}
.log li::before{content:"> ";color:var(--ink-500)}
.log li:first-child{color:var(--ink-100)}
.pie{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:4px;border-top:1px solid var(--ink-700)}
.link{border:0;background:none;padding:6px 0;cursor:pointer;color:var(--ink-200);font-size:13.5px;text-decoration:underline;text-decoration-color:var(--ink-500);text-underline-offset:3px}
.link:hover{color:var(--cyan-400)}
.link.peligro:hover{color:var(--magenta-400)}

/* preparación */
.asientos{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
.asientos li{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fpick{width:40px;height:40px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;background:var(--ink-950);border:2px solid var(--c);color:var(--c);box-shadow:0 0 10px -3px var(--c);flex:0 0 auto}
.fpick svg{width:66%;height:66%}
.nombre{flex:1 1 70px;min-width:0;padding:8px 10px;border-radius:6px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-50);font:inherit;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--ink-500);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--ink-300)}
.seg button+button{border-left:1px solid var(--ink-500)}
.seg button[aria-pressed="true"]{background:rgba(34,211,255,.16);color:var(--ink-50)}
.quitar{width:30px;height:30px;border-radius:6px;border:1px solid transparent;background:none;color:var(--ink-300);cursor:pointer;font-size:18px;line-height:1}
.quitar:hover{border-color:var(--ink-500);color:var(--magenta-400)}
.modo-desc{margin:8px 0 0;color:var(--ink-300);font-size:13.5px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--ink-200);cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--cyan-500);width:16px;height:16px;flex:0 0 auto}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.unirse{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.unirse input{flex:1 1 90px;min-width:0;padding:8px 10px;border-radius:6px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-50);font:inherit;font-size:15px}
.unirse #sala-codigo{flex:0 1 110px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em}
.sala-codigo{margin:0 0 6px;font-family:var(--font-display);font-size:18px;color:var(--ink-200)}
.sala-codigo b{font-size:30px;letter-spacing:.12em;color:var(--cyan-400);text-shadow:0 0 18px rgba(34,211,255,.45)}
.enlace{display:flex;gap:8px;align-items:center;margin-top:10px;min-width:0}
.enlace code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;padding:7px 10px;border-radius:6px;background:var(--ink-950);border:1px solid var(--ink-600);font-family:var(--font-mono);font-size:12px;color:var(--ink-200)}
.aviso-red{margin:10px 0 0;font-size:14px;color:var(--magenta-400)}
.nombre.fijo{display:flex;align-items:center;color:var(--ink-50);border-color:transparent;background:none}
.chip.tu{border-color:var(--cyan-500);color:var(--cyan-400)}
.asientos .jn{flex:1;font-weight:600;color:var(--ink-50)}
.temas{display:grid;gap:6px}
.temas button{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;cursor:pointer;text-align:left;font-size:14px;
  border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-200);
}
.temas button:hover{border-color:var(--ink-400);color:var(--ink-50)}
.temas button[aria-checked="true"],.tema-unico{border-color:var(--lavanda);background:rgba(196,177,255,.12);color:var(--ink-50);box-shadow:0 0 14px -6px var(--lavanda)}
.temas svg,.tema-unico svg{width:20px;height:20px;flex:0 0 auto;color:var(--lavanda)}
.tema-unico{display:flex;align-items:center;gap:10px;margin:0;padding:9px 11px;border-radius:7px;border-width:1px;border-style:solid;font-size:14px}

/* ---------- ventanas ---------- */
.velo{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:auto;background:rgba(4,6,12,.76);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:aparece .2s ease-out;
}
@keyframes aparece{from{opacity:0}}
.ventana{
  width:min(100%,460px);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;border-radius:12px;
  background:var(--ink-900);border:1px solid var(--ink-500);box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:entra .35s var(--ease-out);
}
@keyframes entra{from{transform:translateY(14px) scale(.97);opacity:0}}
.ventana h2{margin:0 0 12px;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.15;color:var(--ink-50);text-wrap:balance}
.ventana h3{margin:18px 0 6px;font-family:var(--font-mono);font-weight:500;font-size:12.5px;color:var(--cyan-500)}
.ventana p,.ventana li{color:var(--ink-200);font-size:14.5px}
.ventana ul,.ventana ol{padding-left:20px;margin:6px 0}
.ventana li{margin:4px 0}
.ventana b{color:var(--ink-50);font-weight:600}
.cerrar-fila{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.reglas{width:min(100%,600px)}

/* cartas */
.carta{--k:var(--magenta-500);width:min(100%,390px);border:1.5px solid var(--k);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 46px -8px var(--k)}
.carta.pa{--k:var(--cyan-500)}
.carta header{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--k)}
.carta header svg{width:30px;height:31px}
.carta .rot{margin:16px 0 0;font-family:var(--font-mono);font-size:12px;color:var(--ink-300)}
.carta blockquote{margin:8px 0 16px;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.25;color:var(--ink-50)}
.carta blockquote s{
  text-decoration:none;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(var(--magenta-500),var(--magenta-500)) no-repeat 0 58%/0% 3px;
  animation:tachar .7s .45s var(--ease-out) forwards;
}
@keyframes tachar{to{background-size:100% 3px}}
.carta .res{margin:0;font-size:16px;color:var(--ink-50)}
.carta .res::before{content:"→ ";color:var(--k);font-weight:700}
.carta .por{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--ink-800);font-size:14.5px;color:var(--ink-100)}
.carta .por b{color:var(--magenta-400)}
.carta .pregunta{margin:10px 0 14px;font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.3;color:var(--ink-50);text-wrap:pretty}
.r-ops{display:grid;gap:7px}
.r-op{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-50);font-size:15px;line-height:1.3;cursor:pointer}
.r-op:hover:not(:disabled){border-color:var(--cyan-500);background:var(--ink-700)}
.r-op:disabled{cursor:default}
.r-op.bien{border-color:var(--green-500);background:rgba(60,240,165,.12)}
.r-op.mal{border-color:var(--magenta-500);background:rgba(255,46,154,.1)}
.r-op.apagada{opacity:.45}
.carta.pa .res{margin-top:14px}
.carta.pa .res.no::before{content:"× ";color:var(--magenta-400)}
.carta .cerrar-fila .nota{font-size:13px}

/* título de propiedad */
.titulo{width:min(100%,360px);padding:0;overflow:hidden}
.titulo .cab{background:var(--g);color:var(--ink-950);padding:16px 18px 14px;text-align:center}
.titulo .cab .rot{margin:0;font-family:var(--font-mono);font-size:12px;opacity:.75}
.titulo .cab h2{color:var(--ink-950);margin:4px 0 2px;font-size:24px}
.titulo .cab p{margin:0;color:var(--ink-950);font-size:14px;opacity:.85}
.titulo .cab.oscura{background:var(--ink-800);color:var(--ink-50);border-bottom:1px solid var(--ink-600)}
.titulo .cab.oscura h2,.titulo .cab.oscura p{color:var(--ink-50)}
.titulo .cab.oscura .ic{width:34px;height:34px;color:var(--g)}
.titulo .cuerpo{padding:14px 18px 18px}
.rentas{margin:0;padding:0;list-style:none}
.rentas li{display:flex;justify-content:space-between;gap:12px;margin:0;padding:6px 6px;border-bottom:1px dashed var(--ink-600);font-variant-numeric:tabular-nums}
.rentas li span:last-child{font-family:var(--font-display);font-weight:600;color:var(--ink-50)}
.rentas li.ahora{background:rgba(34,211,255,.1);border-radius:4px;border-bottom-color:transparent}
.rentas li.ahora span{color:var(--cyan-400)}
.titulo .letra{font-size:13px;color:var(--ink-300);margin:12px 0 0}
.titulo .dueno{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:14px}

/* negociar */
.trato{width:min(100%,680px)}
.lados{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:600px){.lados{grid-template-columns:1fr}}
.lado h3{margin-top:4px}
.otros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.otros button{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:999px;border:1px solid var(--ink-500);background:none;cursor:pointer;font-size:13px;color:var(--ink-200)}
.otros button[aria-pressed="true"]{border-color:var(--cyan-500);background:rgba(34,211,255,.12);color:var(--ink-50)}
.otros .ficha-mini{width:22px;height:22px}
.props{display:grid;gap:2px;max-height:230px;overflow:auto;margin-bottom:10px}
.props label{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:14px;color:var(--ink-100);cursor:pointer}
.props label.no{color:var(--ink-400);cursor:not-allowed}
.props input{accent-color:var(--cyan-500);flex:0 0 auto}
.campo{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-200);margin-top:6px}
.campo input{width:110px;padding:6px 8px;border-radius:6px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-50);font:inherit;font-variant-numeric:tabular-nums}
.aviso{margin:12px 0 0;color:var(--magenta-400);font-size:14px;min-height:1.4em}

/* final */
.final .gana{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.final .gana .ficha-mini{width:52px;height:52px;border-width:3px}
.final .rank{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.final .rank li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin:0}
.final .rank .plata{font-size:16px}

/* retos de programación */
.reto{width:min(100%,560px)}
.r-cab .rot{margin:0;font-family:var(--font-mono);font-size:12px;color:var(--cyan-500)}
.r-cab h2{margin:4px 0}
.reto .r-cab .nota{margin:0 0 14px}
.reto .r-pide{margin:0 0 12px;color:var(--ink-100);font-size:15px}
.reto .r-pide b{color:var(--cyan-400)}
.reto .r-cont{margin:8px 0 0;font-family:var(--font-mono);font-size:12px;color:var(--ink-300)}
.reto .r-msg{margin:6px 0 0;min-height:1.3em;color:var(--magenta-400);font-size:14px}
.reto .r-pie{margin:8px 0 0}
.r-fichas{display:grid;gap:6px}
.r-ficha{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-50);font-size:14.5px;line-height:1.3;cursor:pointer}
.r-ficha:hover{border-color:var(--cyan-500);background:var(--ink-700)}
.reto .r-orden{list-style:none;counter-reset:paso;margin:0 0 12px;padding:0;display:grid;gap:5px}
.reto .r-orden li{counter-increment:paso;display:flex;gap:10px;align-items:center;margin:0;padding:7px 10px;min-height:36px;border-radius:7px;font-size:14px;color:var(--ink-50);background:rgba(34,211,255,.08);border:1px solid rgba(34,211,255,.35)}
.reto .r-orden li::before{content:counter(paso);font-family:var(--font-mono);font-size:12px;color:var(--cyan-400)}
.reto .r-orden li.vacio{background:none;border-style:dashed;border-color:var(--ink-500)}
.r-linea{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.r-linea.medio{justify-content:center}
.r-recta{position:relative;height:10px;margin:4px 0 2px;border-radius:5px;background:var(--ink-700);overflow:hidden}
.r-recta span{position:absolute;top:0;bottom:0;background:var(--cyan-500);box-shadow:0 0 10px var(--cyan-500);transition:left .3s,width .3s}
#r-num{width:110px;padding:8px 10px;border-radius:6px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-50);font:inherit;font-size:16px}
.reto .r-intentos{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.reto .r-intentos li{margin:0;padding:3px 9px;border-radius:999px;border:1px solid var(--ink-500);font-family:var(--font-mono);font-size:12.5px;color:var(--ink-200)}
.reto .r-intentos b{color:var(--ink-50)}
.r-barras{display:flex;align-items:flex-end;gap:4px;height:156px}
.r-barra{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-start;height:calc(20px + var(--h) * 124px);padding-top:3px;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--violet-500),rgba(167,139,250,.35))}
.r-barra b{font-family:var(--font-display);font-size:13px;color:var(--ink-950)}
.r-cambio{flex:0 0 26px;width:26px;height:26px;align-self:center;padding:0;border-radius:50%;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--cyan-400);font-size:13px;cursor:pointer}
.r-cambio:hover{border-color:var(--cyan-500)}
.r-monton{margin:8px 0}
.r-cartas{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:40px;margin-top:4px}
.r-carta{display:grid;place-items:center;width:38px;height:40px;padding:0;border-radius:6px;border:1px solid var(--ink-500);background:var(--ink-800);font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-200)}
.r-carta.tope{cursor:pointer;color:var(--ink-50);border-color:var(--cyan-500);background:rgba(34,211,255,.12);box-shadow:0 0 12px -4px var(--cyan-500)}
.r-carta.hecha{border-color:var(--green-500);color:var(--green-500)}
.r-torres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r-torre{position:relative;height:130px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:0 4px 8px;border-radius:8px;border:1px solid var(--ink-600);background:var(--ink-800);cursor:pointer}
.r-torre.sel{border-color:var(--cyan-500);box-shadow:0 0 14px -4px var(--cyan-500)}
.r-torre .palo{position:absolute;left:50%;bottom:8px;width:4px;height:100px;margin-left:-2px;border-radius:2px;background:var(--ink-500)}
.r-torre .disco{position:relative;height:18px;border-radius:9px}
.r-torre .d1{width:36%;background:var(--cyan-500)}
.r-torre .d2{width:62%;background:var(--violet-500)}
.r-torre .d3{width:88%;background:var(--magenta-500)}
.r-lab{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));width:min(100%,300px);aspect-ratio:1;margin:0 auto;background:var(--ink-950);border-radius:4px}
.r-lab i{display:grid;place-items:center;min-height:0;overflow:hidden;border:2px solid transparent}
.r-lab i.n{border-top-color:var(--cyan-700)}
.r-lab i.e{border-right-color:var(--cyan-700)}
.r-lab i.s{border-bottom-color:var(--cyan-700)}
.r-lab i.o{border-left-color:var(--cyan-700)}
.r-lab i.r{background:rgba(34,211,255,.09)}
.r-lab i.meta{background:rgba(60,240,165,.22)}
.r-lab svg{width:80%;height:80%}
.r-flechas{display:grid;grid-template-columns:repeat(3,46px);grid-template-areas:". n ." "o s e";gap:6px;justify-content:center;margin-top:10px}
.r-flechas .mini{font-size:18px;padding:6px 0}
.r-arbol,.r-mapa{display:block;width:100%;height:auto}
.r-arbol line,.r-mapa line{stroke:var(--ink-500);stroke-width:2.5;stroke-linecap:round}
.r-arbol line.on,.r-mapa line.on{stroke:var(--cyan-500)}
.r-arbol circle{fill:var(--ink-800);stroke:var(--ink-400);stroke-width:1.5}
.r-arbol .visto circle{stroke:var(--cyan-500)}
.r-arbol .act circle{fill:var(--cyan-500);stroke:var(--cyan-400)}
.r-arbol text,.r-mapa text{fill:var(--ink-100);font-family:var(--font-display);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.r-arbol .act text{fill:var(--ink-950)}
.r-mapa .peso{font-family:var(--font-mono);font-size:11px;font-weight:500;fill:var(--ink-100);paint-order:stroke;stroke:var(--ink-900);stroke-width:5px}
.r-mapa .nodo{cursor:pointer}
.r-mapa .nodo circle{fill:var(--ink-800);stroke:var(--ink-400);stroke-width:2}
.r-mapa .nodo.fin circle{stroke:var(--green-500)}
.r-mapa .nodo.on circle{fill:rgba(34,211,255,.2);stroke:var(--cyan-500)}
.r-mapa .nodo:hover circle{stroke:var(--cyan-400)}
.r-mapa .nombre{font-family:var(--font-body);font-size:10.5px;font-weight:500;fill:var(--ink-300)}
.r-monedas{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;min-height:8px}
.r-moneda{width:48px;height:48px;padding:0;border-radius:50%;border:2px solid var(--oro);background:rgba(255,201,77,.1);color:var(--oro);font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer}
.r-moneda:hover{background:rgba(255,201,77,.22)}
.r-moneda.chica{width:34px;height:34px;font-size:12px}
.r-cosas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.r-cosa{display:grid;gap:2px;text-align:left;padding:8px 10px;border-radius:7px;border:1px solid var(--ink-500);background:var(--ink-800);color:var(--ink-100);cursor:pointer}
.r-cosa[aria-pressed="true"]{border-color:var(--green-500);background:rgba(60,240,165,.1)}
.r-cosa b{color:var(--ink-50);font-size:14px}
.r-cosa small{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-300)}
.r-doc{padding:12px 14px;border-radius:8px;background:var(--ink-50);color:var(--ink-950);font-size:17px;min-height:48px}
.r-doc .cursor{display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:text-bottom;background:var(--ink-950);animation:parpadeo 1s steps(1) infinite}
.reto .r-pila{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.reto .r-pila li{margin:0;padding:5px 10px;border-radius:6px;background:var(--ink-800);border:1px solid var(--ink-600);font-family:var(--font-mono);font-size:12.5px;color:var(--ink-200)}
.reto .r-pila li:first-child{border-color:var(--cyan-500);color:var(--ink-50)}
.r-fin{padding:14px;border-radius:8px;margin-bottom:6px}
.r-fin.si{background:rgba(60,240,165,.1);border:1px solid var(--green-500)}
.r-fin.no{background:rgba(255,46,154,.08);border:1px solid var(--magenta-500)}
.reto .r-fin p{margin:0;color:var(--ink-100)}
.reto .r-fin .r-veredicto{margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:22px}
.reto .r-fin.si .r-veredicto{color:var(--green-500)}
.reto .r-fin.no .r-veredicto{color:var(--magenta-400)}
.codigo{margin:10px 0 0;padding:12px 14px;border-radius:8px;overflow-x:auto;background:var(--ink-950);border:1px solid var(--ink-600);font-family:var(--font-mono);font-size:12.5px;line-height:1.55;color:var(--ink-100)}
/* el código se ve como se escribe: <= y == sin juntarse en un solo signo */
.codigo code{font-family:inherit;font-variant-ligatures:none}
.py-k{color:var(--magenta-400)}
.py-s{color:var(--green-500)}
.py-c{color:var(--ink-400)}
.py-n{color:var(--cyan-400)}
.py-d{color:var(--violet-500)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .carta blockquote s{background-size:100% 3px}
}
</style>

let TEMA = null, CASILLAS = BASE, LYCAN = [], PREGUNTAS = [];
const DEL_GRUPO = {};
BASE.forEach((c, i) => { if (c.g) (DEL_GRUPO[c.g] ||= []).push(i); });

function aplicarTema(id){
  const T = TEMAS[id], otros = ORDEN_CURSOS.filter(c => c !== id);
  let e = 0, s = 0;
  CASILLAS = BASE.map(b => {
    if (b.t === 'prop'){ const [ep, n, sub] = T.eps[e++]; return {...b, ep, n, sub}; }
    if (b.t === 'curso'){ const c = CURSOS[otros[s++]]; return {...b, n:c.n, corto:c.corto, ic:c.ic}; }
    return b;
  });
  Object.keys(GRUPOS).forEach((g, k) => GRUPOS[g].n = T.modulos[k]);
  PREGUNTAS = T.preguntas;
  LYCAN = T.lycan.map((c, k) => ({...c, t:c.t.replace(/\{(\d+)\}/g, (_, i) => nom(CASILLAS[+i])), a:JUGADAS_LYCAN[k]}));
  TEMA = id;
}

const BREAK = {lycan:8};

const COLORES = ['#22D3FF','#FF2E9A','#3CF0A5','#FFC94D','#A78BFA','#FF9640'];
const FICHAS = [
  {id:'lobo', n:'el lobo'}, {id:'bola', n:'la bola de captura'}, {id:'manzana', n:'la manzana de Newton'},
  {id:'huevo', n:'el huevo frito'}, {id:'engranaje', n:'el engranaje'}, {id:'neurona', n:'la neurona'},
];
const NOMBRES_BOT = ['lycan','Burbuja','Mochila','Pila','Cola','Hanoi'];

// ---------- utilidades ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(n).toLocaleString('es-CO');
const nom = c => c.n.replace(/­/g, '');
const r6 = () => 1 + Math.floor(Math.random() * 6);
const dormir = ms => new Promise(r => setTimeout(r, ms));
const SIN_MOV = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PASO = SIN_MOV ? 0 : 115;
function barajar(n){
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const icono = id => id === 'lobo' ? '<svg><use href="#lobo"/></svg>' : `<svg><use href="#i-${id}"/></svg>`;
const fichaMini = (p, extra='') => `<span class="ficha-mini ${extra}" style="--c:${p.color}">${icono(p.ficha)}</span>`;

// ---------- estado ----------
const GUARDADO = 'lycanopolis.v1';
let G = null, ocupado = false, botTimer = null;
const UI = {vista:'setup', ventana:null, setup:null, cas:[], plata:{}, ver:null};

// En línea: el anfitrión mueve la partida y cada invitado juega desde su navegador (ver «en línea», más abajo).
const RED = {rol:null, yo:'anfitrion', peer:null, sala:null, conexiones:new Map(), anfitrion:null, nombre:'', msg:'', estado:''};
const enLinea = () => RED.rol !== null;
const soyInvitado = () => RED.rol === 'invitado';
// Mientras el anfitrión ejecuta la jugada de un invitado, ACTOR es ese invitado.
let ACTOR = null;
// Si el asiento k lo juega una persona en este navegador (en una partida local, todas las personas).
function esMio(k){
  const j = G && G.jugadores[k];
  if (!j || j.bot) return false;
  return !enLinea() || (j.disp || 'anfitrion') === (ACTOR ?? RED.yo);
}

const cur = () => G.jugadores[G.turno];
const vivos = () => G.jugadores.filter(j => !j.fuera);
const duenoDe = i => G.due[i] ? G.due[i].o : -1;
const tieneGrupo = (pi, g) => DEL_GRUPO[g].every(i => duenoDe(i) === pi);
const cuantos = (pi, t) => CASILLAS.reduce((n, c, i) => n + (c.t === t && duenoDe(i) === pi ? 1 : 0), 0);
const deJugador = pi => Object.keys(G.due).map(Number).filter(i => G.due[i].o === pi).sort((a, b) => a - b);
const libres = () => CASILLAS.filter((c, i) => c.precio && !G.due[i]).length;

function anotar(msg){
  G.bitacora.push(msg);
  if (G.bitacora.length > 150) G.bitacora.shift();
  G.msg = msg;
}

function renta(i, tirada){
  const c = CASILLAS[i], d = G.due[i];
  if (!d || d.m) return 0;
  if (c.t === 'prop') return d.h > 0 ? c.renta[d.h] : c.renta[0] * (tieneGrupo(d.o, c.g) ? 2 : 1);
  if (c.t === 'curso') return 25 * 2 ** (cuantos(d.o, 'curso') - 1);
  if (c.t === 'serv') return tirada * (cuantos(d.o, 'serv') === 2 ? 10 : 4);
  return 0;
}

function patrimonio(pi){
  let v = G.jugadores[pi].dinero;
  deJugador(pi).forEach(i => {
    const c = CASILLAS[i], o = G.due[i];
    v += o.m ? c.precio / 2 : c.precio;
    if (o.h) v += o.h * GRUPOS[c.g].casa;
  });
  return v;
}

// Lo que el jugador puede juntar deshaciendo todos sus ejercicios e hipotecándolo todo.
function liquidez(pi){
  let v = G.jugadores[pi].dinero;
  deJugador(pi).forEach(i => {
    const c = CASILLAS[i], o = G.due[i];
    if (o.h) v += o.h * GRUPOS[c.g].casa / 2;
    if (!o.m) v += c.precio / 2;
  });
  return v;
}

// ---------- partida ----------
function setupInicial(){
  return {
    jugadores:[
      {nombre:'Jugador 1', ficha:'lobo', bot:false},
